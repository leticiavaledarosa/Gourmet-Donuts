<meta name="claude:viewport-fit-sides" content="cover">
<title>Gourmet Donuts</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Pacifico&display=swap">
<style>
/* Clean, photo-led donut shop in six pages (hash routes): white page, one strong pink, chocolate type,
   pastel blocks for menu categories. All editable content lives in the DATA block of the script. */
:root{
  --white:#ffffff; --cream:#FFF6E9; --choc:#3B1F14; --choc-2:#2A150D; --pink:#E83E8C; --pink-dk:#C92D74; --pink-soft:#FDE3EE;
  --gold:#D4A056; --muted:#6E5A50; --line:#EFE3D3;
  --p-pink:#FDE3EE; --p-gold:#FBEBCF; --p-blue:#E2EEFB; --p-lilac:#EDE4FA; --p-mint:#DFF3EA;
  --head:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--choc);font-family:var(--head);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:900;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--head);padding:13px 24px;border-radius:8px;border:2px solid transparent;transition:background .15s,color .15s,border-color .15s;cursor:pointer}
.btn.pink{background:var(--pink);color:#fff}.btn.pink:hover{background:var(--pink-dk)}
.btn.line{border-color:var(--choc);color:var(--choc);background:transparent}.btn.line:hover{background:var(--choc);color:#fff}
.btn.white{background:#fff;color:var(--pink-dk)}.btn.white:hover{background:var(--choc);color:#fff}
.kicker{display:block;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink-dk);margin-bottom:12px}
.lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:60ch}
mark.fill{background:#FFF1B8;color:var(--choc);border-radius:4px;padding:0 4px;font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--pink);color:#fff;vertical-align:middle}
.chip.ex{background:transparent;color:var(--muted);border:1.5px dashed #c9b6a6}

/* demo notice */
.demo{background:#FFF1B8;color:var(--choc);font-size:13.5px;font-weight:600;text-align:center;padding-block:8px;border-bottom:1px solid #F0DC8A}
.demo b{font-weight:800}
/* header */
header.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#fff}
header .wrap{display:flex;align-items:center;gap:22px;padding-block:10px}
.brand img{height:52px;width:auto}
nav.main{margin-left:auto;display:flex;gap:4px;font-weight:600;font-size:15px}
nav.main a{padding:8px 12px;border-radius:8px}
nav.main a:hover{color:var(--pink-dk)}
nav.main a[aria-current="page"]{background:var(--pink-soft);color:var(--pink-dk)}
.lang{display:flex;gap:2px}
.lang button{font:700 13px var(--head);background:none;border:1.5px solid transparent;border-radius:999px;padding:5px 9px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{border-color:var(--choc);color:var(--choc)}
#burger{display:none;background:none;border:2px solid var(--choc);border-radius:8px;padding:7px 12px;font:700 14px var(--head);color:var(--choc);cursor:pointer}
#mnav{display:none;border-bottom:1px solid var(--line);background:#fff}
#mnav a{display:block;padding:12px 0;font-weight:600;border-bottom:1px solid var(--line)}
#mnav a:last-child{border-bottom:0}
#mnav a[aria-current="page"]{color:var(--pink-dk)}
@media (max-width:980px){nav.main{display:none}#burger{display:inline-block}.lang{margin-left:auto}body.open #mnav{display:block}.brand img{height:44px}}

/* page header band (inner pages) */
.phead{background:var(--cream);padding-block:clamp(40px,6vw,64px)}
.phead h1{font-size:clamp(36px,5.4vw,58px)}

/* home hero */
.hero{position:relative;min-height:clamp(360px,50vw,520px);display:flex;align-items:center;overflow:hidden;background:var(--choc)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(42,21,13,.84) 0%,rgba(42,21,13,.5) 52%,rgba(42,21,13,.05) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-block:52px}
.hero .txt{max-width:560px;color:#fff}
.hero h1{font-size:clamp(40px,6vw,72px);color:#fff}
.hero h1 span{display:block;font-family:var(--script);font-weight:400;letter-spacing:0;color:#ffb3d1;font-size:.6em;line-height:1.35;margin-top:6px}
.hero p{margin-top:16px;font-size:18px;color:rgba(255,255,255,.88);max-width:44ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .btn.line{border-color:#fff;color:#fff}.hero .btn.line:hover{background:#fff;color:var(--choc)}

section{padding-block:clamp(52px,7vw,88px)}
.alt{background:var(--cream)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:clamp(24px,3.5vw,38px)}
.sec-head>div{min-width:0}
.sec-head h2{font-size:clamp(30px,4.2vw,46px)}
.sec-head.center{display:block;text-align:center;max-width:680px;margin-inline:auto}
.more-link{font-weight:700;color:var(--pink-dk);white-space:nowrap}

/* news cards (what's new) */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ncard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 0 rgba(59,31,20,.04),0 14px 34px rgba(59,31,20,.08);display:flex;flex-direction:column}
.ncard .ph{position:relative;aspect-ratio:4/3;background:var(--cream)}
.ncard .ph img{width:100%;height:100%;object-fit:cover}
.ncard .ph .chip{position:absolute;top:14px;left:14px}
.ncard .tx{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.ncard h3{font-size:21px;font-weight:800;letter-spacing:-.01em}
.ncard p{color:var(--muted);font-size:15px}
.ncard .when{margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;color:var(--pink-dk)}
@media (max-width:900px){.news{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.news{grid-template-columns:1fr}}

/* split + round photo */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center}
.split>div{min-width:0}
.split h2{font-size:clamp(30px,4.2vw,46px)}
.split p{color:var(--muted);margin-top:14px;font-size:17px}
.split p b{color:var(--choc)}
.split .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.round{position:relative;width:min(420px,100%);aspect-ratio:1;margin:0 auto}
.round::before{content:"";position:absolute;inset:0;border-radius:50%;border:4px dotted var(--pink);opacity:.45}
.round::after{content:"";position:absolute;inset:5%;border-radius:50%;background:var(--pink-soft)}
.round img{position:absolute;z-index:1;inset:8%;width:84%;height:84%;object-fit:cover;border-radius:50%;border:8px solid #fff;box-shadow:0 18px 44px rgba(59,31,20,.16)}
.split.rev .media{order:-1}
@media (max-width:820px){.split{grid-template-columns:1fr}.split.rev .media{order:0}.round{width:min(330px,86%)}}

/* quick links on home */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.qk{border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s}
.qk:hover{transform:translateY(-3px)}
.qk b{font-family:var(--script);font-weight:400;font-size:28px;line-height:1.15}
.qk span{color:var(--muted);font-size:14.5px}
.qk em{margin-top:auto;font-style:normal;font-weight:700;font-size:14px;color:var(--choc)}
@media (max-width:860px){.quick{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.quick{grid-template-columns:1fr}}

/* stats + steps */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.stat{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 10px 26px rgba(59,31,20,.06);border:1px solid var(--line)}
.stat b{display:block;font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1.05;color:var(--pink-dk)}
.stat span{color:var(--muted);font-size:14px}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.stepc{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 26px rgba(59,31,20,.06)}
.stepc::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;margin-bottom:12px}
.stepc h3{font-size:19px;font-weight:800}
.stepc p{color:var(--muted);font-size:15px;margin-top:6px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

/* menu */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.filters button{font:600 14px var(--head);background:#fff;color:var(--choc);border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.filters button:hover{border-color:var(--choc)}
.filters button[aria-pressed="true"]{background:var(--choc);border-color:var(--choc);color:#fff}
.panels{display:grid;gap:22px}
.panel{border-radius:24px;padding:clamp(20px,3vw,32px)}
.panel h3{font-family:var(--script);font-weight:400;font-size:clamp(28px,3.4vw,38px);letter-spacing:0;line-height:1.15;margin-bottom:6px}
.panel .sub{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.bg-pink{background:var(--p-pink)}.bg-pink h3{color:var(--pink-dk)}
.bg-gold{background:var(--p-gold)}.bg-gold h3{color:#A86A1E}
.bg-blue{background:var(--p-blue)}.bg-blue h3{color:#2F5F98}
.bg-lilac{background:var(--p-lilac)}.bg-lilac h3{color:#6B48A8}
.bg-mint{background:var(--p-mint)}.bg-mint h3{color:#22785A}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 14px}
.pgrid figure{margin:0;text-align:center}
.pgrid .im{width:100%;max-width:140px;aspect-ratio:1;border-radius:50%;margin:0 auto 10px;border:5px solid #fff;box-shadow:0 8px 20px rgba(59,31,20,.14);overflow:hidden;background:#fff;display:grid;place-items:center}
.pgrid .im img{width:100%;height:100%;object-fit:cover}
.pgrid .im i{font-style:normal;font-weight:900;font-size:26px;color:var(--pink);letter-spacing:.02em}
.pgrid figcaption{font-weight:800;font-size:15px;line-height:1.25}
.pgrid small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.deal{background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 22px rgba(59,31,20,.07)}
.deal .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.deal h4{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.deal .pr{font-size:24px;font-weight:900;color:var(--pink-dk);white-space:nowrap;letter-spacing:-.02em}
.deal p{color:var(--muted);font-size:14.5px}
.deal .when{font-size:13px;font-weight:700;color:var(--choc);margin-top:auto;padding-top:6px}
.drinks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.drinks div{background:#fff;border-radius:16px;padding:16px 18px;color:var(--muted);font-size:15px}
.drinks b{display:block;color:var(--choc);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
@media (max-width:700px){.drinks{grid-template-columns:1fr}}

/* shops */
.shopgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.slist{display:grid;gap:10px;max-height:820px;overflow:auto;padding:4px 6px 4px 2px}
.sitem{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;font:inherit;color:inherit}
.sitem:hover{border-color:var(--pink)}
.sitem[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.sitem .th{width:64px;height:64px;border-radius:12px;flex:none;overflow:hidden;background:var(--cream);display:grid;place-items:center}
.sitem .th img{width:100%;height:100%;object-fit:cover}
.sitem .th img.lg{width:46px;height:auto;object-fit:contain}
.sitem b{display:block;font-size:16px;font-weight:800}
.sitem span span{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.sdetail{position:sticky;top:90px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(59,31,20,.1)}
.sdetail .photo{aspect-ratio:16/8;background:var(--cream);position:relative}
.sdetail .photo>img{width:100%;height:100%;object-fit:cover}
.noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,rgba(232,62,140,.18) 0 4px,transparent 5px) 0 0/26px 26px,var(--cream);color:var(--muted);font-size:14px;font-weight:600;padding:20px}
.noimg img{width:100px;height:auto;margin:0 auto 8px}
.sdetail .info{padding:20px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.sdetail h3{grid-column:1/-1;font-size:26px;font-weight:900}
.sdetail .lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-dk);margin-bottom:4px}
.sdetail table{border-collapse:collapse;font-size:14.5px;width:100%}
.sdetail td{padding:2px 0}.sdetail td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sdetail .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.map{position:relative;aspect-ratio:16/10;background:var(--p-blue)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#2F5F98;font-weight:700;padding:20px;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(47,95,152,.08) 38px 40px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(47,95,152,.08) 38px 40px),var(--p-blue)}
@media (max-width:900px){.shopgrid{grid-template-columns:1fr}.sdetail{position:static;order:-1}.slist{max-height:none}}
@media (max-width:520px){.sdetail .info{grid-template-columns:1fr}}

/* catering */
.band{background:var(--pink);color:#fff;text-align:center;border-radius:28px;padding:clamp(34px,5vw,56px) clamp(20px,4vw,48px)}
.band h2{font-size:clamp(30px,4.4vw,46px);color:#fff}
.band p{margin:12px auto 0;max-width:52ch;color:rgba(255,255,255,.92);font-size:17px}
.sizes{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);margin-top:28px;flex-wrap:wrap}
.sizes div{font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.sizes b{display:block;font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:none}
.band .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.band .btn.line{border-color:#fff;color:#fff}.band .btn.line:hover{background:#fff;color:var(--pink-dk)}

/* contact */
.cgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:start}
form.card,.cinfo{background:#fff;border-radius:22px;padding:clamp(20px,3vw,30px);box-shadow:0 12px 34px rgba(59,31,20,.08);border:1px solid var(--line)}
form.card{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .full{grid-column:1/-1}
label{display:grid;gap:6px;font-weight:700;font-size:14px;min-width:0}
input,select,textarea{font:500 15px var(--head);color:var(--choc);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
textarea{min-height:130px;resize:vertical}
.ok{grid-column:1/-1;background:var(--p-mint);color:#22785A;border-radius:12px;padding:12px 14px;font-weight:700}
.cinfo{display:grid;gap:18px}
.cinfo .lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-dk)}
.cinfo p{font-weight:600}
@media (max-width:820px){.cgrid{grid-template-columns:1fr}form.card{grid-template-columns:1fr}}

/* footer */
footer{background:var(--choc-2);color:rgba(255,246,233,.8)}
footer .wrap{padding-block:46px 22px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
footer .slogan{font-family:var(--script);color:#ffb3d1;font-size:28px;line-height:1.3;margin-top:10px}
footer h4{margin:0 0 12px;color:#fff;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
footer a:hover{color:#fff}
footer .bot{margin-top:34px;padding-top:16px;border-top:1px solid rgba(255,246,233,.12);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,246,233,.5)}
@media (max-width:760px){footer .cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.qk{transition:none}}
</style>

<div class="demo gut" id="demo" role="note"></div>
<header class="head gut">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Gourmet Donuts, home"><img src="img/logo.png" alt="Gourmet Donuts"></a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="lang" id="lang" role="group" aria-label="Language"><button data-l="0">EN</button><button data-l="1">PT</button><button data-l="2">ES</button></div>
    <button id="burger" aria-expanded="false" aria-controls="mnav">Menu</button>
  </div>
</header>
<div id="mnav" class="gut"><div class="wrap" id="mnavIn"></div></div>
<main id="app"></main>
<footer class="gut"><div class="wrap" id="foot"></div></footer>

<script>
/* =====================================================================
   EDITE AQUI · conteúdo do site
   - Cada texto pode ter en / pt / es. Se faltar pt ou es, aparece o en.
   - exemplo:true mostra um selo "exemplo" (apague quando o item for real).
   - foto: caminho de uma imagem dentro da pasta img/.
   ===================================================================== */
const DATA={
 // Novidades: aparecem no topo da página inicial
 news:[
  {tag:{en:'New',pt:'Novo',es:'Nuevo'},foto:'img/m/butternut.jpg',exemplo:true,
   name:{en:'Butternut Crunch',pt:'Butternut Crunch',es:'Butternut Crunch'},
   text:{en:'Cake donut rolled in a sweet, crunchy butternut coating.',pt:'Donut de massa de bolo coberto com uma farofa doce e crocante de butternut.',es:'Dona de pastel cubierta con un crujiente dulce de butternut.'},
   when:{en:'Available now',pt:'Já disponível',es:'Ya disponible'}},
  {tag:{en:'Seasonal',pt:'Sazonal',es:'De temporada'},foto:'img/m/cinnamon.jpg',exemplo:true,
   name:{en:'Cinnamon Roll',pt:'Cinnamon Roll',es:'Cinnamon Roll'},
   text:{en:'Baked fresh and glazed warm. A winter favorite.',pt:'Assado na hora e glaceado ainda quente. O favorito do inverno.',es:'Horneado y glaseado en caliente. El favorito del invierno.'},
   when:{en:'Winter menu',pt:'Cardápio de inverno',es:'Menú de invierno'}},
  {tag:{en:'Deal',pt:'Oferta',es:'Oferta'},foto:'img/f/holes.jpg',exemplo:true,
   name:{en:'Donut holes for the office',pt:'Donut holes para o escritório',es:'Donut holes para la oficina'},
   text:{en:'Box of 50 donut holes plus a coffee box for the team.',pt:'Caixa com 50 donut holes e uma caixa de café para a equipe.',es:'Caja de 50 donut holes y una caja de café para el equipo.'},
   when:{en:'Every Friday',pt:'Toda sexta-feira',es:'Cada viernes'}}
 ],
 // Sabores do cardápio: [nome, foto (ou ''), descrição]. Sem foto aparecem as iniciais.
 donuts:[
  ['Rainbow Sprinkles','img/m/sprinkles.jpg',{en:'Raised, sprinkles',pt:'Fermentado, granulado',es:'Levadura, chispas'}],

function vMenu(){
 const F=[['all','fAll'],['donuts','fDon'],['seasonal','fSea'],['combos','fCom'],['offers','fOff'],['bakery','fBak'],['sandwiches','fSan'],['drinks','fDri']];
 const show=k=>filt==='all'||filt===k;
 let h=`<div class="phead gut"><div class="wrap"><span class="kicker">${t('menuK')}</span><h1>${t('menuH')}</h1></div></div>
<section class="gut" style="padding-top:clamp(28px,4vw,40px)"><div class="wrap">
 <div class="filters" role="group">${F.map(([k,l])=>`<button data-f="${k}" aria-pressed="${filt===k}">${t(l)}</button>`).join('')}</div><div class="panels">`;
 if(show('seasonal'))h+=`<div class="panel bg-lilac"><h3>${t('fSea').toLowerCase()}</h3><p class="sub">${t('seaSub')}</p>${dealGrid(DATA.seasonal,false)}</div>`;
 if(show('combos'))h+=`<div class="panel bg-gold"><h3>${t('fCom').toLowerCase()}</h3><p class="sub">${t('comSub')}</p>${dealGrid(DATA.combos,true)}</div>`;
 if(show('offers'))h+=`<div class="panel bg-pink"><h3>${t('fOff').toLowerCase()}</h3><p class="sub">${t('offSub')}</p>${dealGrid(DATA.offers,true)}</div>`;
 if(show('donuts'))h+=`<div class="panel bg-pink"><h3>${t('fDon').toLowerCase()}</h3><p class="sub">${t('donutsSub')}</p>${prodGrid(DATA.donuts)}</div>`;
 if(show('bakery'))h+=`<div class="panel bg-gold"><h3>${t('fBak').toLowerCase()}</h3><p class="sub">${t('bakSub')}</p>${prodGrid(DATA.bakery)}</div>`;
 if(show('sandwiches'))h+=`<div class="panel bg-blue"><h3>${t('fSan').toLowerCase()}</h3><p class="sub">${t('sanSub')}</p>${prodGrid(DATA.sandwiches)}</div>`;
 if(show('drinks'))h+=`<div class="panel bg-mint"><h3>${t('fDri').toLowerCase()}</h3><div class="drinks">${T.dri[L].map(d=>`<div>${d}</div>`).join('')}</div></div>`;
 return h+`</div></div></section>`}

function shopDetail(){const s=DATA.shops[shopI];
 return `<div class="photo">${s.foto?`<img src="${s.foto}" alt="${esc(s.name)} shop">`:`<div class="noimg"><div><img src="img/logo.png" alt="">${t('photoSoon')}</div></div>`}</div>
 <div class="info"><h3>${esc(s.name)}</h3>
  <div><div class="lbl">${t('addr')}</div>${esc(s.addr)}<div class="lbl" style="margin-top:12px">${t('phone')}</div>${s.phone?esc(s.phone):'—'}</div>
  <div><div class="lbl">${t('hours')}</div>${s.hours?`<table>${s.hours.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`:t('hoursTbd')}</div>
  <div class="acts"><a class="btn pink" href="${mapsUrl(s.addr)}" target="_blank" rel="noopener">${t('dir')}</a>${s.phone?`<a class="btn line" href="tel:${s.phone.replace(/\D/g,'')}">${t('call')} ${esc(s.phone)}</a>`:''}</div>
 </div>
 <div class="map"><div class="fallback"><a href="${mapsUrl(s.addr)}" target="_blank" rel="noopener">${t('mapFb')}</a></div><iframe title="Map: ${esc(s.name)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent('Gourmet Donuts '+s.addr)}&z=15&output=embed"></iframe></div>`}
function vShops(){return `
<div class="phead gut"><div class="wrap"><span class="kicker">${t('shopsK')}</span><h1>${t('shopsH')}</h1><p class="lead">${t('shopsP')}</p></div></div>
<section class="gut" style="padding-top:clamp(28px,4vw,40px)"><div class="wrap shopgrid">
 <div class="slist" role="group">${DATA.shops.map((s,i)=>`<button class="sitem" data-shop="${i}" aria-pressed="${i===shopI}"><span class="th">${s.foto?`<img src="${s.foto}" alt="">`:`<img class="lg" src="img/logo.png" alt="">`}</span><span><b>${esc(s.name)}</b><span>${esc(s.addr)}</span>${s.phone?`<span>${esc(s.phone)}</span>`:''}</span></button>`).join('')}</div>
 <div class="sdetail" id="sdetail">${shopDetail()}</div>
</div></section>`}

function vContact(){const c=DATA.contact;return `
<div class="phead gut"><div class="wrap"><span class="kicker">${t('conK')}</span><h1>${t('conH')}</h1></div></div>
<section class="gut" style="padding-top:clamp(28px,4vw,40px)"><div class="wrap cgrid">
 <form class="card" id="cform" novalidate>
  <label for="f-name">${t('fName')}<input id="f-name" required autocomplete="name"></label>
  <label for="f-email">${t('fEmail')}<input id="f-email" type="email" required autocomplete="email"></label>
  <label for="f-phone">${t('fPhone')}<input id="f-phone" type="tel" autocomplete="tel"></label>
  <label for="f-topic">${t('fTopic')}<select id="f-topic">${[['gen','tGen'],['cat','tCat'],['fr','tFr'],['job','tJob']].map(([v,k])=>`<option value="${v}"${topic===v?' selected':''}>${t(k)}</option>`).join('')}</select></label>
  <label class="full" for="f-shop">${t('fShop')}<select id="f-shop"><option>${t('any')}</option>${DATA.shops.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></label>
  <label class="full" for="f-msg">${t('fMsg')}<textarea id="f-msg" required></textarea></label>
  <div class="full"><button class="btn pink" type="submit">${t('send')}</button></div>
  <div class="ok" id="cok" hidden>${t('sent')}</div>
 </form>
 <div class="cinfo">
  <div><div class="lbl">${t('mainShop')}</div><p>${esc(c.address)}</p></div>
  <div><div class="lbl">${t('phone')}</div><p>${esc(c.phone)}</p></div>
  <div><div class="lbl">${t('fEmail')}</div><p>${c.email?esc(c.email):t('emailTbd')}</p></div>
  <div><div class="lbl">${t('follow')}</div><p><a href="${c.facebook}" target="_blank" rel="noopener" style="color:var(--pink-dk)">Facebook →</a></p></div>
 </div>
</div></section>`}

const VIEWS={home:vHome,about:vAbout,menu:vMenu,shops:vShops,catering:vCatering,contact:vContact};
function chrome(){
 const links=PAGES.map(p=>`<a href="#${p}"${p===page?' aria-current="page"':''}>${t(p)}</a>`).join('');
 document.getElementById('nav').innerHTML=links;document.getElementById('mnavIn').innerHTML=links;
 document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===L));
 document.getElementById('burger').textContent=['Menu','Menu','Menú'][L];
 document.getElementById('foot').innerHTML=`<div class="cols"><div><img src="img/logo.png" alt="Gourmet Donuts" style="height:62px;filter:drop-shadow(0 0 1px #fff)"><p class="slogan">Have a Gourmet Day!</p></div>
  <div><h4>${t('visit')}</h4><ul>${PAGES.slice(1).map(p=>`<li><a href="#${p}">${t(p)}</a></li>`).join('')}</ul></div>
  <div><h4>${t('contact')}</h4><ul><li>${esc(DATA.contact.address)}</li><li>${esc(DATA.contact.phone)}</li><li><a href="${DATA.contact.facebook}" target="_blank" rel="noopener">Facebook</a></li></ul></div></div>
  <div class="bot"><span>© 2026 Gourmet Donuts · ${t('ex')}</span><span>${t('foot2')}</span></div>`;
 document.documentElement.lang=['en','pt','es'][L];
 document.getElementById('demo').innerHTML=t('demo');
}
function render(scroll){chrome();document.getElementById('app').innerHTML=VIEWS[page]();if(scroll)window.scrollTo(0,0)}
function route(){const h=(location.hash||'').slice(1);page=PAGES.includes(h)?h:'home';document.body.classList.remove('open');document.getElementById('burger').setAttribute('aria-expanded','false');render(true)}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const tp=e.target.closest('[data-topic]');if(tp)topic=tp.dataset.topic;
 const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;render(false);return}
 const s=e.target.closest('[data-shop]');if(s){shopI=+s.dataset.shop;document.querySelectorAll('[data-shop]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.shop===shopI));document.getElementById('sdetail').innerHTML=shopDetail();if(window.innerWidth<900)document.getElementById('sdetail').scrollIntoView({behavior:'smooth',block:'start'});return}
 const lb=e.target.closest('#lang button');if(lb){L=+lb.dataset.l;try{localStorage.setItem('gd-site-lang',L)}catch(x){}render(false);return}
 if(e.target.closest('#burger')){const o=document.body.classList.toggle('open');document.getElementById('burger').setAttribute('aria-expanded',o)}
});
document.addEventListener('submit',e=>{if(e.target.id!=='cform')return;e.preventDefault();const f=e.target;if(!f.checkValidity()){f.reportValidity();return}document.getElementById('cok').hidden=false;f.reset()});
route();
</script>
