<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kitchen OS · Gourmet Donuts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: maroon brand bar (their site header) with phase switcher + screen tabs; each screen is a touch-first workspace below */
:root{
  --bg:#FFF8EC; --surface:#FFFDF8; --surface-2:#F8EBD3; --fg:#3A0A16; --muted:#7A4A3A; --line:#EFD9B4;
  --accent:#C8101C; --accent-ink:#FFF8EC; --brand:#5B001B; --brand-2:#74102E; --brand-ink:#FFF8EC; --gold:#FBB03B; --gold-ink:#3A0A16;
  --done:#1F7A45; --done-soft:#E1F1E6; --warn:#9A5B00; --warn-soft:#FCEBC8; --bad:#C8101C; --bad-soft:#FDE7E3;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A0609; --surface:#260B12; --surface-2:#33121B; --fg:#FBEFE6; --muted:#C7A698; --line:#4A2029;
  --accent:#F25560; --accent-ink:#1A0609; --brand:#3D0012; --brand-2:#5B001B; --brand-ink:#FBEFE6; --gold:#FBB03B; --gold-ink:#1A0609;
  --done:#4FD08A; --done-soft:#123521; --warn:#F2B84B; --warn-soft:#3A2A10; --bad:#FF6B6B; --bad-soft:#3A1216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A0609; --surface:#260B12; --surface-2:#33121B; --fg:#FBEFE6; --muted:#C7A698; --line:#4A2029;
  --accent:#F25560; --accent-ink:#1A0609; --brand:#3D0012; --brand-2:#5B001B; --brand-ink:#FBEFE6; --gold:#FBB03B; --gold-ink:#1A0609;
  --done:#4FD08A; --done-soft:#123521; --warn:#F2B84B; --warn-soft:#3A2A10; --bad:#FF6B6B; --bad-soft:#3A1216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 0 var(--accent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-size:26px;line-height:1;display:flex;align-items:center;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand .date{font-family:var(--body);font-size:13px;font-weight:500;opacity:.8}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.ph{border:1px solid rgba(255,248,236,.25);background:transparent;color:var(--brand-ink);font:700 13px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.ph b{color:var(--gold);margin-right:4px}
.ph[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.ph[aria-pressed="true"] b{color:var(--accent)}
.demo-btn{border:0;background:var(--gold);color:var(--gold-ink);font:800 14px var(--body);padding:9px 14px;border-radius:999px;cursor:pointer}
.demo-btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand-ink)}
.lang{display:flex;border:1px solid rgba(255,248,236,.3);border-radius:12px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--brand-ink);opacity:.75;font:700 14px var(--body);padding:8px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);opacity:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.tab{flex:none;border:0;background:var(--brand-2);color:var(--brand-ink);font:600 15px var(--body);padding:11px 16px;border-radius:12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-block:22px 56px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 10px}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;margin-bottom:18px}
.head > div:first-child{margin-right:auto;min-width:0;flex:1 1 320px}
.preview{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 15px var(--body);padding:11px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
.btn.go{background:var(--done);color:var(--bg);border-color:var(--done)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill.ok{background:var(--done-soft);color:var(--done)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.dn{--g:#c98a4b;width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,var(--hole,var(--bg)) 0 22%,var(--g) 23% 62%,#E8C07D 63% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.dn.lg{width:52px;height:52px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center}
thead th{font-size:12px;font-weight:700;color:var(--muted);vertical-align:bottom;background:var(--surface);text-transform:uppercase;letter-spacing:.04em}
thead th .fl{display:flex;flex-direction:column;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:12px;min-width:64px}
tbody th{text-align:left;font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
td input,.field input,.field select,.ed input{font:600 16px var(--body);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
td input{width:62px;padding:8px 4px;text-align:center}
td input:disabled{opacity:.6}
td.tot,th.tot{font-weight:800;background:var(--surface-2)}
tfoot td,tfoot th{font-weight:800;background:var(--surface-2);border-bottom:0}
.lt th,.lt td{text-align:left}
.lt td.n,.lt th.n{text-align:right}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.sc{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;--hole:var(--surface)}
.sc.done{border-color:var(--done);opacity:.8}
.sc .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface-2)}
.sc.done .sh{background:var(--done-soft)}
.sc .code{font-family:var(--display);font-size:26px;line-height:1}
.sc .snm{font-weight:600;font-size:14px;color:var(--muted)}
.sc .prog{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.it{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.it .nm{font-weight:600}
.it .q{margin-left:auto;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800;color:transparent}
.it.ok{background:var(--done-soft)}
.it.ok .chk{background:var(--done);border-color:var(--done);color:var(--bg)}
.it.ok .q,.it.ok .nm{color:var(--done)}
.foot{padding:12px 16px;border-top:1px solid var(--line)}
.foot .btn{width:100%;font-size:18px;padding:14px;font-weight:800}
.foot .when{font-size:14px;color:var(--done);font-weight:700;text-align:center}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.bars{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br i{display:block;height:14px;border-radius:7px;background:var(--accent);min-width:2px}
.br .tr{background:var(--surface-2);border-radius:7px}
.br b{text-align:right;font-variant-numeric:tabular-nums}
.alerts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:15px}
.alerts li.bad{background:var(--bad-soft)}
.alerts li.warn{background:var(--warn-soft)}
.alerts li strong{white-space:nowrap}
.route{display:flex;flex-direction:column;gap:10px}
.stop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stop .num{font-family:var(--display);font-size:28px;width:40px;text-align:center;color:var(--muted)}
.stop .nm{font-weight:700;font-size:17px;flex:1 1 180px;min-width:0}
.stop .nm small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.stop .btn{min-width:170px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.field input,.field select{padding:11px 12px;width:100%}
.req{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;--hole:var(--surface)}
.req .txt{flex:1 1 240px;min-width:0}
.req .txt b{font-size:17px}
.req .txt small{display:block;color:var(--muted);font-size:14px}
.req .q{font-family:var(--display);font-size:30px}
.pos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pos .panel{display:flex;flex-direction:column;gap:10px}
.pos .panel h2{margin:0}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-top:18px}
.flow span{background:var(--surface-2);padding:8px 12px;border-radius:999px}
.flow i{font-style:normal;color:var(--accent)}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--done)}
.up{color:var(--done);font-weight:800}.down{color:var(--bad);font-weight:800}.same{color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
.credit{font-size:13px;color:var(--muted);padding-block:0 32px}
/* demo setup */
.demo-hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:20px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-bottom:16px}
.demo-hero p{margin:0;opacity:.92}
.demo-hero .btn{border-color:transparent}
.cat h3{font-family:var(--display);font-weight:400;font-size:20px;margin:16px 0 6px}
.ed{display:grid;grid-template-columns:24px 30px minmax(0,1fr) minmax(0,1fr) 76px 36px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);--hole:var(--surface)}
.ed input[type=text]{padding:8px 10px;width:100%;min-width:0}
.ed input[type=number]{padding:8px 6px;width:100%;text-align:center}
.ed input[type=checkbox]{width:22px;height:22px}
.ed.off{opacity:.55}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:8px;padding:4px}
.stx{display:grid;grid-template-columns:56px minmax(0,1fr) 36px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.stx input{padding:8px 10px;width:100%;min-width:0;font:600 16px var(--body);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.stx b{font-family:var(--display);font-weight:400;font-size:18px}
.colhead{display:grid;grid-template-columns:24px 30px minmax(0,1fr) minmax(0,1fr) 76px 36px;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:8px}
@media (max-width:640px){.ed,.colhead{grid-template-columns:24px 26px minmax(0,1fr) 64px 32px}.ed .es,.colhead .es{display:none}}
@media (max-width:600px){.tab{padding:10px 12px;font-size:14px}.brand{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.it,.sc,.tab,.tv-card{transition:background .2s,border-color .2s}}
/* Kitchen board (tablet and full screen on the kitchen TV): fixed dark look, 16:9, container units */
:root{--tv-bg:#1E0710;--tv-card:#33111D;--tv-fg:#FFF8EC;--tv-muted:#B99A8E;--tv-ok:#3CCF7D;--tv-ok-bg:#12351F;--tv-warn:#FBB03B}
.tv{container-type:inline-size;aspect-ratio:16/9;width:100%;max-width:min(100%,calc((100vh - 60px)*1.7778));margin-inline:auto !important;background:var(--tv-bg);color:var(--tv-fg);border-radius:14px;overflow:hidden;box-shadow:0 0 0 10px #0B0205,0 18px 40px rgba(0,0,0,.25);margin:10px 0 18px}
.tv:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;margin:0;box-shadow:none}
.tv-in{height:100%;padding:1.6cqw;display:grid;grid-template-columns:minmax(0,1fr) 21cqw;grid-template-rows:auto minmax(0,1fr);gap:1.2cqw;grid-template-areas:"top top" "grid side"}
.tv-top{grid-area:top;display:flex;align-items:center;gap:2cqw}
.tv-brand{font-family:var(--display);font-size:2cqw}
.tv-title{font-weight:800;font-size:2.4cqw;letter-spacing:.06em;margin-inline:auto}
.tv-title span{color:var(--tv-muted)}
.tv-clock{font-weight:800;font-size:2.4cqw;font-variant-numeric:tabular-nums}
.tv-grid{grid-area:grid;display:grid;grid-auto-rows:minmax(0,1fr);gap:1cqw;min-height:0}
.tv-card{--hole:var(--tv-card);background:var(--tv-card);border:.25cqw solid transparent;border-radius:1.2cqw;padding:1.2cqw;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:1cqw;min-height:0;overflow:hidden;color:var(--tv-fg);font:inherit;text-align:left;cursor:pointer}
.tv-card .dn{width:4cqw;height:4cqw}
.tv-nm{font-weight:700;font-size:1.55cqw;line-height:1.15}
.tv-nm span{display:block;font-weight:500;color:var(--tv-muted);font-size:1.2cqw}
.tv-q{grid-column:1/-1;font-family:var(--display);font-size:7cqw;line-height:1;align-self:center;font-variant-numeric:tabular-nums}
.tv-st{grid-column:1/-1;font-weight:800;font-size:1.05cqw;letter-spacing:.08em;color:var(--tv-warn)}
.tv-card.ok{--hole:var(--tv-ok-bg);background:var(--tv-ok-bg);border-color:var(--tv-ok)}
.tv-card.ok .tv-q,.tv-card.ok .tv-st{color:var(--tv-ok)}
.tv-empty{grid-column:1/-1;grid-row:1/3;display:grid;place-items:center;font-size:2.4cqw;color:var(--tv-muted)}
.tv-side{grid-area:side;display:flex;flex-direction:column;gap:1cqw;min-height:0}
.tv-box{background:var(--tv-card);border-radius:1.2cqw;padding:1.1cqw 1.3cqw}
.tv-lbl{font-size:1cqw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tv-muted)}
.tv-big{font-family:var(--display);font-size:4cqw;line-height:1.05;font-variant-numeric:tabular-nums}
.tv-big small{font-size:2.2cqw;color:var(--tv-muted)}
.tv-small{font-size:1.1cqw;color:var(--tv-muted)}
.tv-bar{height:.9cqw;border-radius:1cqw;background:var(--tv-bg);margin-top:.6cqw;overflow:hidden}
.tv-bar i{display:block;height:100%;background:var(--tv-ok)}
.tv-stores{flex:1;display:flex;flex-direction:column;min-height:0}
.tv-sg{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:.5cqw;margin-top:.7cqw;flex:1;min-height:0}
.tv-s{display:flex;align-items:center;gap:.6cqw;border-radius:.7cqw;padding:0 .7cqw;font-size:1cqw;background:var(--tv-bg);min-width:0}
.tv-s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tv-muted)}
.tv-s i,.tv-legend i{width:.8cqw;height:.8cqw;border-radius:50%;background:var(--tv-muted);flex:none;display:inline-block}
.tv-s.ready{background:var(--tv-ok-bg)}
.tv-s.ready span{color:var(--tv-ok)}
.tv-s.ready i,.tv-legend .ready i{background:var(--tv-ok)}
.tv-s.packing span{color:var(--tv-warn)}
.tv-s.packing i,.tv-legend .packing i{background:var(--tv-warn)}
.tv-legend{display:flex;flex-wrap:wrap;gap:.4cqw 1.2cqw;font-size:.9cqw;color:var(--tv-muted);margin-top:.6cqw}
.tv-legend span{display:flex;align-items:center;gap:.4cqw}
.tv-grid.d2,.tv-grid.d3,.tv-grid.d4{gap:.7cqw}
.d2 .tv-card,.d3 .tv-card,.d4 .tv-card{padding:.8cqw;column-gap:.7cqw;border-radius:.9cqw;border-width:.2cqw}
.d2 .tv-card .dn{width:2.6cqw;height:2.6cqw}
.d2 .tv-nm{font-size:1.15cqw}.d2 .tv-nm span{font-size:.9cqw}.d2 .tv-q{font-size:4cqw}.d2 .tv-st{font-size:.8cqw}
.d3 .tv-card .dn{width:2.2cqw;height:2.2cqw}
.d3 .tv-nm{font-size:1cqw}.d3 .tv-nm span{font-size:.8cqw}.d3 .tv-q{font-size:3.4cqw}.d3 .tv-st{font-size:.7cqw}
.d4 .tv-card .dn{width:1.8cqw;height:1.8cqw}
.d4 .tv-nm{font-size:.9cqw}.d4 .tv-nm span{font-size:.75cqw}.d4 .tv-q{font-size:2.6cqw}.d4 .tv-st{display:none}
/* TV mode: open the link with #tv on the kitchen TV */
.tvmode .topbar,.tvmode .credit,.tvmode .head,.tvmode .note,.tvmode .preview{display:none}
.tvmode main{padding:0;max-width:none}
.tvmode .tv{border-radius:0;margin:0;box-shadow:none;height:100vh;aspect-ratio:auto}
.tvmode body::before{display:none}

  const o=r6(it.base*s.f*(0.9+((si*7+ii*5+(sd||0))%5)*0.05));
  const sold=Math.round(o*(0.82+((si*3+ii*7)%5)*0.05)), so=(si+ii)%7===0?2:((si*ii)%11===5?1:0), avg=so?o:sold;

}

  el.innerHTML=head(t("ordersH"),t("ordersS"),`<span class="pill ${S.locked?"ok":"warn"}">${S.locked?t("locked"):t("draft")}</span>
   ${S.locked?`<button class="btn" id="unlock">${t("unlock")}</button>`:`<button class="btn" id="copy">${t("copy")}</button><button class="btn" id="clear">${t("clear")}</button><button class="btn primary" id="send">${t("send")}</button>`}`)+`
  <div class="stats">
   <div class="stat"><b>${fmt(grand())}</b><span>${t("items")}</span><em>${its.length} ${t("activeN")}</em></div>
   <div class="stat"><b>${S.stores.length}</b><span>${t("stores")}</span></div>
   <div class="stat"><b>${its.filter(i=>S.produced[i.id]&&itemTotal(i.id)).length}/${its.filter(i=>itemTotal(i.id)).length}</b><span>${t("madeN")}</span></div>
   <div class="stat"><b>${doneCount()}/${rows.length}</b><span>${t("packedN")}</span></div>
  </div>
  <div class="scroll"><table style="min-width:${260+its.length*84}px">
   <thead><tr><th style="text-align:left">${t("store")}</th>${its.map(i=>`<th><div class="fl">${dn(i)}${esc(nm(i))}</div></th>`).join("")}<th class="tot">${t("total")}</th></tr></thead>
   <tbody>${rows.map(s=>`<tr><th>${s.id==="CAT"?"":s.id+" · "}${esc(s.name)}</th>${its.map(i=>`<td><input id="o-${s.id}-${i.id}" type="number" min="0" step="6" inputmode="numeric" value="${q(s.id,i.id)||""}" ${S.locked||s.id==="CAT"?"disabled":""} data-s="${s.id}" data-i="${i.id}" aria-label="${esc(s.name)} ${esc(nm(i))}"></td>`).join("")}<td class="tot">${fmt(storeTotal(s.id))}</td></tr>`).join("")}</tbody>
   <tfoot><tr><th style="text-align:left">${t("total")}</th>${its.map(i=>`<td>${fmt(itemTotal(i.id))}</td>`).join("")}<td>${fmt(grand())}</td></tr></tfoot>
  </table></div><p class="note">${t("note")}</p>`;
  el.querySelectorAll("input").forEach(x=>x.addEventListener("change",e=>{const {s,i}=e.target.dataset;S.orders[s][i]=Math.max(0,parseInt(e.target.value)||0);render()}));
  on("unlock",()=>{S.locked=false;render()});
  on("copy",()=>{S.stores.forEach((s,si)=>S.catalog.forEach((it,ii)=>S.orders[s.id][it.id]=r6(it.base*s.f*(0.9+((si*7+ii*5+3)%5)*0.05))));render()});
  on("clear",()=>{S.stores.forEach(s=>S.catalog.forEach(i=>S.orders[s.id][i.id]=0));render()});
  on("send",()=>{S.locked=true;resetDay();render()});
};
V.kitchen=el=>{
  const list=S.locked?ITEMS().filter(i=>itemTotal(i.id)>0):[];
  const made=list.filter(i=>S.produced[i.id]).length, g=S.locked?grand():0;
  const st=s=>S.storeDone[s.id]?"ready":(S.packed[s.id]&&Object.values(S.packed[s.id]).some(Boolean)?"packing":"pending");
  list.sort((a,b)=>(!!S.produced[a.id])-(!!S.produced[b.id]));
  const n=list.length, cols=n<=8?4:n<=20?5:6, dens=n<=10?"":n<=20?"d2":n<=24?"d3":"d4";
  el.innerHTML=head(t("kitchenH"),t("kitchenS")+" "+t("tvLink"),`<button class="btn gold" id="play2">${simTimer?t("stop"):t("play")}</button><button class="btn" id="fs">${t("fs")}</button>`)+`
  <div class="tv" id="tvScreen"><div class="tv-in">
   <div class="tv-top"><div class="tv-brand">Gourmet Donuts</div><div class="tv-title">TO MAKE <span>· POR HACER</span></div><div class="tv-clock" id="tvClock">${now()}</div></div>
   <div class="tv-grid ${dens}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${n?list.map(i=>`<button class="tv-card ${S.produced[i.id]?"ok":""}" data-i="${i.id}" aria-pressed="${!!S.produced[i.id]}">${dn(i)}<div class="tv-nm">${esc(i.en)}<span>${esc(i.es)}</span></div><div class="tv-q">${fmt(itemTotal(i.id))}</div><div class="tv-st">${S.produced[i.id]?"✓ DONE · HECHO":"TO MAKE · POR HACER"}</div></button>`).join(""):`<div class="tv-empty">Waiting for orders · Esperando pedidos</div>`}</div>
   <aside class="tv-side">
    <div class="tv-box"><div class="tv-lbl">Today · Hoy</div><div class="tv-big">${fmt(g)}</div><div class="tv-small">units · unidades | ${Math.ceil(g/24)} trays · bandejas</div></div>
    <div class="tv-box"><div class="tv-lbl">Made · Hecho</div><div class="tv-big">${made}<small>/${n}</small></div><div class="tv-bar"><i style="width:${n?made/n*100:0}%"></i></div></div>
    <div class="tv-box tv-stores"><div class="tv-lbl">Stores · Tiendas ${doneCount()}/${allStores().length}</div>
     <div class="tv-sg">${allStores().map(s=>`<div class="tv-s ${st(s)}"><i></i><span>${esc(s.name)}</span></div>`).join("")}</div>
     <div class="tv-legend"><span class="ready"><i></i>Ready · Lista</span><span class="packing"><i></i>Packing · Empacando</span><span><i></i>Waiting · Espera</span></div></div>
   </aside></div></div><p class="note">${t("note")}</p>`;
  el.querySelectorAll(".tv-card").forEach(b=>b.onclick=()=>{S.produced[b.dataset.i]=!S.produced[b.dataset.i];render()});
  on("fs",()=>{try{const p=document.getElementById("tvScreen").requestFullscreen?.();p&&p.catch(()=>{})}catch(e){}});
  on("play2",togglePlay);
};
V.pack=el=>{
  if(!S.locked||!grand()){el.innerHTML=head(t("packH"))+`<div class="empty">${t("noOrder")}</div>`;return}
  const rows=[...allStores()].sort((a,b)=>(!!S.storeDone[a.id])-(!!S.storeDone[b.id]));
  el.innerHTML=head(t("packH"),t("packS"),`<span class="pill ${doneCount()===allStores().length?"ok":""}">${doneCount()}/${allStores().length} ${t("packedN")}</span>`)+`
  <div class="stores">${rows.map(s=>{const its=itemsOf(s.id),n=its.filter(i=>isPacked(s.id,i.id)).length,all=n===its.length,d=S.storeDone[s.id];
   return `<article class="sc ${d?"done":""}"><div class="sh"><div><div class="code">${s.id==="CAT"?"Catering":s.id}</div><div class="snm">${esc(s.name)}</div></div><div class="prog">${n}/${its.length}</div></div>
    ${d?"":its.map(i=>`<button class="it ${isPacked(s.id,i.id)?"ok":""}" data-s="${s.id}" data-i="${i.id}"><span class="chk">✓</span>${dn(i)}<span class="nm">${esc(nm(i))}</span><span class="q">${q(s.id,i.id)}</span></button>`).join("")}
    <div class="foot">${d?`<div class="when">✓ ${t("packedAt")} ${d} · <button class="btn sm" data-undo="${s.id}">${t("undo")}</button></div>`:`<button class="btn go" data-done="${s.id}" ${all?"":"disabled"}>${t("doneBtn")}</button>`}</div></article>`}).join("")}</div>`;
  el.querySelectorAll(".it").forEach(b=>b.onclick=()=>{const {s,i}=b.dataset;S.packed[s]=S.packed[s]||{};S.packed[s][i]=!S.packed[s][i];render()});
  el.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{S.storeDone[b.dataset.done]=now();render()});
  el.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{delete S.storeDone[b.dataset.undo];render()});
};
V.owner=el=>{
  let left=0;const sold=[],its=ITEMS();
  const byStore=S.stores.map(s=>{const l=its.reduce((a,i)=>a+C(s.id,i.id).left,0);left+=l;its.forEach(i=>{const c=C(s.id,i.id);if(c.so)sold.push({s,i,at:c.at})});return {s,l}}).sort((a,b)=>b.l-a.l);
  const max=Math.max(...byStore.map(x=>x.l),1), deliv=S.stores.filter(s=>S.delivery[s.id]?.st==="deliv").length;
  const pend=S.requests.filter(r=>r.st==="pending").length, low=lowStock();
  const al=[...sold.slice(0,4).map(x=>`<li class="bad"><strong>${esc(x.s.name)}</strong><span>${t("aSold")} ${esc(nm(x.i))} ${t("aAt")} ${x.at}</span></li>`),
    ...low.map(gr=>`<li class="warn"><strong>${t("aStock")}</strong><span>${nm(gr)}</span></li>`),...(pend?[`<li><strong>${pend}</strong><span>${t("aReq")}</span></li>`]:[])];
  el.innerHTML=head(t("ownerH"),t("ownerS"))+`
  <div class="stats">
   <div class="stat"><b>${fmt(madeUnits())}</b><span>${t("kMade")}</span><em>${t("kOf")} ${fmt(grand())}</em></div>
   <div class="stat"><b>${deliv}/${S.stores.length}</b><span>${t("kDeliv")}</span></div>
   <div class="stat"><b>${fmt(left)}</b><span>${t("kLeft")}</span><em>${t("kMost")} ${esc(byStore[0]?.s.name||"—")}</em></div>
   <div class="stat"><b>${sold.length}</b><span>${t("kSold")}</span></div>
  </div>
  <div class="cols">
   <div class="panel"><h2>${t("alerts")}</h2>${al.length?`<ul class="alerts">${al.join("")}</ul>`:`<p class="sub">${t("noAlerts")}</p>`}</div>
   <div class="panel"><h2>${t("leftBy")}</h2><div class="bars">${byStore.map(x=>`<div class="br"><span>${esc(x.s.name)}</span><div class="tr"><i style="width:${x.l/max*100}%"></i></div><b>${x.l}</b></div>`).join("")}</div></div>
  </div>`;
};

V.suggest=el=>{
  if(!store(sugStore))sugStore=S.stores[0].id;
  let a=0,b=0;S.stores.forEach(s=>ITEMS().forEach(i=>{a+=q(s.id,i.id);b+=suggestion(s.id,i.id).v}));const d=b-a;
  el.innerHTML=head(t("sugH"),t("sugS"),`<button class="btn primary" id="apply">${t("apply")}</button>`)+`
  <div class="stats"><div class="stat"><b class="${d>0?"up":d<0?"down":"same"}">${d>0?"+":""}${fmt(d)}</b><span>${t("chain")}</span><em>${fmt(a)} → ${fmt(b)}</em></div></div>
  <div class="panel">
   <div class="form" style="margin-bottom:14px;max-width:420px"><label class="field" for="ss">${t("store")}${storeSelect("ss",sugStore)}</label></div>
   <div class="scroll" style="border:0"><table class="lt"><thead><tr><th>${t("item")}</th><th class="n">${t("avg")}</th><th class="n">${t("avgLeft")}</th><th class="n">${t("soldDays")}</th><th class="n">${t("today")}</th><th class="n">${t("suggest")}</th><th></th></tr></thead>
   <tbody>${ITEMS().map(i=>{const h=H(sugStore,i.id),sg=suggestion(sugStore,i.id),cur=q(sugStore,i.id);
    return `<tr><td>${itemCell(i)}</td><td class="n">${h.sold}</td><td class="n">${h.left}</td><td class="n">${h.so?`<span class="pill bad">${h.so} ${t("days")}</span>`:"0"}</td><td class="n">${cur}</td><td class="n"><b class="${sg.v>cur?"up":sg.v<cur?"down":"same"}">${sg.v}</b></td><td><span class="pill ${sg.why==="up"?"bad":sg.why==="down"?"warn":""}">${t("why_"+sg.why)}</span></td></tr>`}).join("")}</tbody></table></div>
  </div>`;
  document.getElementById("ss").onchange=e=>{sugStore=e.target.value;render()};
  on("apply",()=>{S.stores.forEach(s=>ITEMS().forEach(i=>S.orders[s.id][i.id]=suggestion(s.id,i.id).v));S.locked=false;view="orders";toast(t("applied"));render()});
};

     <label class="field" for="niEn">${t("nameEn")}<input id="niEn" required placeholder="Maple Bacon"></label>
     <label class="field" for="niEs">${t("nameEs")}<input id="niEs" placeholder="Maple con tocino"></label>
     <label class="field" for="niC">${t("category")}<select id="niC">${Object.keys(CATS).map(c=>`<option value="${c}">${nm(CATS[c])}</option>`).join("")}</select></label>
     <button class="btn primary" type="submit">${t("addItem")}</button></form>
   </div>
   <div class="panel" style="align-self:start"><h2>${t("storesH")}</h2><p class="sub">${t("storesS")}</p>
    ${S.stores.map(s=>`<div class="stx"><b>${s.id}</b><input data-sn="${s.id}" value="${esc(s.name)}" aria-label="${t("store")} ${s.id}"><button class="x" data-rs="${s.id}" aria-label="${t("remove")}" ${S.stores.length<2?"disabled":""}>×</button></div>`).join("")}
    <div style="margin-top:12px"><button class="btn" id="addStore">${t("addStore")}</button></div></div>
  </div>`;
  el.querySelectorAll("[data-on]").forEach(x=>x.onchange=()=>{item(x.dataset.on).on=x.checked;S.stores.forEach(ensureStore);render()});
  el.querySelectorAll("[data-en]").forEach(x=>x.onchange=()=>{const i=item(x.dataset.en);i.en=x.value.trim()||i.en;render()});
  el.querySelectorAll("[data-es]").forEach(x=>x.onchange=()=>{const i=item(x.dataset.es);i.es=x.value.trim()||i.en;render()});
  el.querySelectorAll("[data-base]").forEach(x=>x.onchange=()=>{const i=item(x.dataset.base);i.base=Math.max(0,parseInt(x.value)||0);S.stores.forEach(s=>{S.orders[s.id][i.id]=r6(i.base*s.f)});render()});
  el.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{S.catalog=S.catalog.filter(i=>i.id!==x.dataset.rm);render()});
  el.querySelectorAll("[data-sn]").forEach(x=>x.onchange=()=>{const s=store(x.dataset.sn);s.name=x.value.trim()||s.name;render()});
  el.querySelectorAll("[data-rs]").forEach(x=>x.onclick=()=>{S.stores=S.stores.filter(s=>s.id!==x.dataset.rs);render()});
  on("addStore",()=>{const s={id:"S"+String(S.nextId++).padStart(2,"0"),name:t("newStore"),f:1};S.stores.push(s);ensureStore(s,S.stores.length);render()});
  document.getElementById("addItem").addEventListener("submit",e=>{e.preventDefault();const en=document.getElementById("niEn").value.trim();if(!en)return;
    const c=document.getElementById("niC").value;
    S.catalog.push({id:"x"+(S.nextId++),en,es:document.getElementById("niEs").value.trim()||en,c,g:"#C8101C",base:c==="holes"?48:12,on:true});S.stores.forEach(ensureStore);toast(t("itemAdded"));render()});
  on("play",togglePlay);
  on("newDay",()=>{const sd=Math.floor(Math.random()*5);S.stores.forEach((s,si)=>S.catalog.forEach((it,ii)=>S.orders[s.id][it.id]=r6(it.base*s.f*(0.9+((si*7+ii*5+sd)%5)*0.05))));S.locked=true;resetDay();toast(t("newDayDone"));render()});
  on("reset",()=>{stopPlay();try{localStorage.removeItem(KEY)}catch(e){}seed();view="demo";toast(t("resetDone"));render()});
};

/* ---------- play the morning: makes items, packs stores, delivers ---------- */
function step(){
  S.locked=true;
  const nextItem=ITEMS().find(i=>itemTotal(i.id)>0&&!S.produced[i.id]);
  if(nextItem){S.produced[nextItem.id]=true;return true}
  const nextStore=allStores().find(s=>!S.storeDone[s.id]);
  if(nextStore){S.packed[nextStore.id]={};itemsOf(nextStore.id).forEach(i=>S.packed[nextStore.id][i.id]=true);S.storeDone[nextStore.id]=now();return true}
  const out=S.stores.find(s=>S.delivery[s.id]?.st==="out");
  if(out){S.delivery[out.id]={st:"deliv",at:now()};return true}
  const toGo=S.stores.find(s=>!S.delivery[s.id]);
  if(toGo){S.delivery[toGo.id]={st:"out",at:now()};return true}
  return false;
}
function stopPlay(){clearInterval(simTimer);simTimer=null}
function togglePlay(){
  if(simTimer){stopPlay();render();return}
  resetDay();S.locked=true;if(view==="demo"||view==="orders")view="kitchen";
  simTimer=setInterval(()=>{if(!step())stopPlay();render()},900);render();
}

/* ---------- shell ---------- */
function render(remote){
  if(tvMode){document.documentElement.classList.add("tvmode");view="kitchen"}
  const p=phaseOf(view)||1;
  document.getElementById("phases").innerHTML=[1,2,3,4].map(n=>`<button class="ph" data-p="${n}" aria-pressed="${view!=="demo"&&n===p}"><b>${n}</b>${t("p"+n)}</button>`).join("");
  document.getElementById("tabs").innerHTML=view==="demo"?"":PHASES[p].map(v=>`<button class="tab" role="tab" data-v="${v}" aria-selected="${v===view}">${t("v_"+v)}</button>`).join("");
  const db=document.getElementById("demoBtn");db.textContent=t("demo");db.setAttribute("aria-pressed",view==="demo");db.onclick=()=>{view="demo";render();window.scrollTo(0,0)};
  document.querySelectorAll(".ph").forEach(b=>b.onclick=()=>{view=PHASES[b.dataset.p][0];render();window.scrollTo(0,0)});
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.getElementById("dateLbl").textContent=new Date().toLocaleDateString(lang==="en"?"en-US":"es-US",{weekday:"short",month:"2-digit",day:"2-digit"});
  document.getElementById("credit").textContent=t("credit");
  document.documentElement.lang=lang;
  const y=window.scrollY;V[view](document.getElementById("main"));window.scrollTo(0,y);
  if(!remote)save();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
setInterval(()=>{const c=document.getElementById("tvClock");if(c)c.textContent=now()},15000);
render();
</script>
