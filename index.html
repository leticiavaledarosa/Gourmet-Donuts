<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Gourmet Donuts Kitchen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: chocolate band on top (brand, language, 5 screens); below it one working screen at a time.
   Kitchen screens use very large numerals; office screens use dense centered tables. */
:root{
  --bg:#FFF9F3; --surface:#ffffff; --ink:#3B1F14; --muted:#6E5A50; --line:#EFE3D3;
  --band:#ffffff; --band-ink:#3B1F14; --band-muted:#8A7468;
  --berry:#E83E8C; --berry-ink:#ffffff; --berry-bg:#FDE3EE; --choc:#3B1F14; --gold:#D4A056; --cream-2:#F7E6CC;
  --mint:#1c8062; --mint-bg:#DFF3EA; --warn:#9c5a06; --warn-bg:#fdebc6; --snow:#2468ad; --snow-bg:#E2EEFB;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin:0 auto}
.band{background:var(--band);color:var(--band-ink)}
.band .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 0}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
.pal{display:flex;gap:6px;align-items:center}
.pal button{width:24px;height:24px;border-radius:50%;border:2px solid var(--band-muted);cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{border-color:var(--band-ink);outline:2px solid var(--band-ink);outline-offset:2px}
.lang{display:flex;gap:4px}
.lang button{background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px;color:var(--band-muted);cursor:pointer;font-weight:600;font-size:13px}
.lang button[aria-pressed="true"]{border-color:var(--band-muted);color:var(--band-ink)}
nav{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:4px solid transparent;padding:10px 14px 9px;color:var(--band-muted);cursor:pointer;font-weight:600;white-space:nowrap}
nav button[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--band-ink)}
main{padding-block:22px 60px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head>div{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.pill.ok{background:var(--mint-bg);color:var(--mint);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.snow{background:var(--snow-bg);color:var(--snow);border-color:transparent}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--berry);color:var(--berry-ink);border-color:transparent}
.btn.big{padding:13px 18px;font-size:17px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=number],input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.alert{border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.alert>div{min-width:0;flex:1 1 260px}
.alert.snow{background:var(--snow-bg);color:var(--snow)}
.alert.lock{background:var(--warn-bg);color:var(--warn)}
.alert b{font-family:var(--display);font-size:17px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
td .row{flex-wrap:nowrap}
.fl{font-weight:600}
.fl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
.step output{min-width:58px;font-weight:700;font-size:18px;display:inline-block}
.up{color:var(--mint);font-weight:700}.down{color:var(--berry);font-weight:700}
.std input{width:64px;text-align:center;padding:6px 4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.done{background:var(--mint-bg);border-color:transparent}
.dough{font-family:var(--display);font-weight:700;font-size:22px}
.huge{font-family:var(--display);font-weight:800;font-size:clamp(56px,9vw,84px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.batch{font-weight:700;font-size:17px}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini li{display:flex;justify-content:space-between;gap:10px}
.shead{display:flex;align-items:center;gap:10px;color:#fff;border-radius:10px;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:18px}
.shead span:last-child{margin-left:auto;font-family:var(--body);font-size:14px;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;cursor:pointer}
.line .q{font-family:var(--display);font-weight:800;font-size:24px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.line .d{flex:1;min-width:0}
.line .d small{display:block;color:var(--muted);font-size:12px;white-space:normal}
.line .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:800}
.line[aria-pressed="true"]{background:var(--mint-bg);border-color:transparent}
.line[aria-pressed="true"] .ck{background:var(--mint);border-color:var(--mint);color:var(--surface)}
.line[aria-pressed="true"] .d b{text-decoration:line-through}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi{min-width:0}
.kpi b{display:block;overflow-wrap:anywhere;font-family:var(--display);font-size:clamp(18px,5vw,28px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.stages{display:inline-flex;gap:4px;vertical-align:middle}
.stages i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.stages i.on{background:var(--mint)}
.bar{height:10px;border-radius:5px;background:var(--berry);min-width:2px}
.bars{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:7px 10px;align-items:center;font-variant-numeric:tabular-nums}
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wx div{background:var(--bg);border-radius:10px;padding:8px 4px;font-variant-numeric:tabular-nums}
.wx div.sn{background:var(--snow-bg);color:var(--snow)}
.wx .g{font-size:22px;line-height:1}
/* Invoices follow the chosen palette. */
.paper{--choc:var(--band);--cream:var(--band-ink);
  background:var(--surface);color:var(--ink);border:1px solid var(--line);max-width:800px;box-shadow:0 10px 30px rgb(59 34 24 / .12)}
.paper small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.paper .ring{width:38px;height:38px;border-radius:50%;border:11px solid var(--berry);flex:none;box-shadow:inset 0 0 0 2px var(--choc),0 0 0 2px var(--choc)}
.paper .lg{display:flex;align-items:center;gap:12px}
.paper .pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:13px}
.p0{border-radius:6px;padding:clamp(18px,4vw,40px);border-top:6px double var(--choc)}
.p0 .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-bottom:22px}
.p0 .r{text-align:right;margin-left:auto}
.p0 .logo{font-family:var(--display);font-weight:800;font-size:26px;color:var(--choc);letter-spacing:-.01em}
.p0 .ttl{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:.22em;text-transform:uppercase;color:var(--berry)}
.p0 .sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:2px solid var(--choc);margin-top:4px;padding-top:12px;color:var(--muted)}
.p0 .sum span:last-child{text-align:right}
.p0 .sum b{display:block;font-family:var(--display);font-weight:800;font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.p1{border-radius:18px;overflow:hidden;border:0}
.p1 .hd{background:var(--choc);color:var(--cream);padding:clamp(18px,4vw,30px);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.p1 .hd b{font-family:var(--display);font-weight:800;font-size:26px;display:block;line-height:1.1}
.p1 .hd small{color:var(--band-muted);letter-spacing:.04em;text-transform:none;font-weight:500;font-size:13px}
.p1 .hd .ring{box-shadow:none;border-color:var(--berry)}
.p1 .nr{text-align:right;margin-left:auto}
.p1 .nr span{display:block;font-family:var(--display);font-weight:500;letter-spacing:.24em;text-transform:uppercase;font-size:14px;color:var(--band-muted)}
.p1 .stripe{height:10px;background:repeating-linear-gradient(90deg,var(--berry) 0 20px,var(--cream) 20px 40px)}
.p1 .bd{padding:clamp(16px,4vw,30px);display:flex;flex-direction:column;gap:18px}
.p1 .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.p1 .info div{background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.p1 .info b{display:block;margin:3px 0 1px}.p1 .info span{color:var(--muted);font-size:13px}
.p1 tbody tr:nth-child(even){background:var(--bg)}
.p1 td,.p1 th{border-bottom:0}
.p1 .tot{background:var(--choc);color:var(--cream);border-radius:14px;padding:14px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.p1 .tot b{font-family:var(--display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums}
.p1 .pfoot{margin-top:0}
.p2{border-radius:18px;overflow:hidden;border:0;display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr);max-width:880px}
.p2 aside{background:var(--berry-bg);padding:64px 22px 22px;position:relative;display:flex;flex-direction:column;gap:16px}
.p2 .drip{position:absolute;top:0;left:0;width:100%;height:44px;fill:var(--berry)}
.p2 aside b{display:block}.p2 aside span{color:var(--muted);font-size:13px}
.p2 .lg b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--choc)}
.p2 .n{font-family:var(--display);font-size:18px}
.p2 .amt{margin-top:auto;padding-top:14px;border-top:2px dashed var(--berry)}
.p2 .amt b{font-family:var(--display);font-weight:800;font-size:36px;color:var(--berry);font-variant-numeric:tabular-nums;line-height:1.1}
.p2 .spk{display:flex;gap:9px;flex-wrap:wrap}
.p2 .spk i{width:16px;height:5px;border-radius:3px;background:var(--choc)}
.p2 .spk i:nth-child(3n+1){background:var(--berry);transform:rotate(-24deg)}.p2 .spk i:nth-child(3n+2){background:var(--mint);transform:rotate(18deg)}.p2 .spk i:nth-child(3n){transform:rotate(40deg)}
.p2 .bd{padding:clamp(16px,4vw,30px);display:flex;flex-direction:column;gap:16px;min-width:0}
.p2 h3{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
.p2 .pfoot{margin-top:auto}
@media (max-width:640px){.p2{grid-template-columns:1fr}}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{min-width:0}
.f input[type=number]{width:92px;text-align:center}
.f input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry)}
.note{color:var(--muted);font-size:13px}
.olist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.orow .d{min-width:0}.orow .d b{font-size:18px;display:block}.orow small{color:var(--muted)}
.orow .step button{width:54px;height:54px;font-size:28px;border-radius:14px;background:var(--berry-bg);border-color:transparent}
.orow .step output{font-family:var(--display);font-size:28px;min-width:76px;text-align:center}
.totbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:14px 18px;font-weight:600;max-width:760px}
.totbar b{font-family:var(--display);font-size:34px;font-weight:800;margin-right:auto;font-variant-numeric:tabular-nums}
.okbig{font-family:var(--display);font-weight:800;font-size:26px;color:var(--mint)}
.bk{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}.bk .card{padding:22px;gap:12px}.bk .dough{font-size:28px}.bk .batch{font-size:22px}
.spick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.spick button{border:0;border-radius:12px;color:#fff;padding:10px 12px;text-align:left;cursor:pointer;opacity:.72;min-width:0}
.spick button[aria-pressed="true"]{opacity:1;outline:4px solid var(--ink);outline-offset:2px}
.spick b{display:block;font-size:14px}.spick small{font-size:12px}
.pickbig{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.pickbig button{opacity:1;padding:16px}.pickbig b{font-size:17px}
.shead.big{font-size:26px;padding:16px 18px;max-width:760px}
.flist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.flist .line{padding:14px}.flist .line .q{font-size:34px;min-width:84px}.flist .line .d b{font-size:19px}.flist .line .d small{font-size:14px}.flist .line .ck{width:38px;height:38px;font-size:22px}
@media (max-width:520px){.orow .step button{width:46px;height:46px}.orow .step output{min-width:56px;font-size:24px}.flist .line .q{font-size:28px;min-width:64px}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:520px){ th,td{padding:8px 6px} .step button{width:36px;height:36px} .step output{min-width:44px}
  nav button{padding:10px 9px 9px;font-size:14px} .seg button{padding:8px 9px;font-size:14px}
  .spick:not(.pickbig){display:flex;overflow-x:auto;padding:6px 6px 10px;scrollbar-width:thin}
  .spick:not(.pickbig) button{flex:0 0 44%} }
/* ---- Clean layer (same identity as the new site) ---- */
.band{border-bottom:1px solid var(--line)}
.band .in{padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--script);font-weight:400;font-size:24px;letter-spacing:0;color:var(--berry)}
.brand img{height:50px;width:auto;flex:none}
.brand small{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted)}
nav button{font-weight:700;font-size:15px;color:var(--band-muted)}
nav button[aria-current="page"]{color:var(--choc);border-bottom-color:var(--berry)}
.lang button{font-weight:700}
.lang button[aria-pressed="true"]{border-color:var(--choc);color:var(--choc)}
h1{font-weight:900;font-size:clamp(28px,4.6vw,40px);letter-spacing:-.02em}
h2{font-weight:800;font-size:20px;letter-spacing:-.01em}
.btn{border-radius:10px;font-weight:700}
.btn.pri{background:var(--berry);border-color:var(--berry)}
.btn.pri:hover{background:#C92D74}
.btn.big{font-size:18px;padding:14px 18px;border-radius:12px}
.card,.kpi,.panel,.orow,.scroll{border:0;box-shadow:0 1px 0 rgba(59,31,20,.04),0 10px 26px rgba(59,31,20,.07)}
.card{border-radius:22px}
.bk .card:nth-child(5n+1){background:#FDE3EE}.bk .card:nth-child(5n+2){background:#FBEBCF}.bk .card:nth-child(5n+3){background:#E2EEFB}.bk .card:nth-child(5n+4){background:#EDE4FA}.bk .card:nth-child(5n){background:#DFF3EA}
.bk .card{box-shadow:none}
.card.done{background:var(--mint-bg)!important;outline:3px solid var(--mint)}
.dough,.bk .dough{font-family:var(--script);font-weight:400;font-size:28px;letter-spacing:0}
.huge{font-weight:900;font-size:clamp(64px,10vw,96px);letter-spacing:-.04em;line-height:.95}
.batch,.bk .batch{font-weight:800;font-size:18px;color:var(--choc)}
.okbig{font-weight:900;font-size:24px}
.kpi b{font-weight:900;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em}
.orow{border-radius:18px}
.orow .d b{font-weight:800;font-size:18px}
.orow .step output{font-weight:900;font-size:30px;letter-spacing:-.02em}
.orow .step button{background:var(--berry-bg);border:0;color:var(--berry);border-radius:50%}
.totbar{background:var(--choc);border-radius:18px}
.totbar b{font-weight:900;font-size:38px}
.flist .line{background:#fff;border:0;border-radius:16px;box-shadow:0 6px 18px rgba(59,31,20,.07)}
.flist .line .q{font-weight:900;font-size:36px;letter-spacing:-.02em}
.flist .line .d b{font-weight:800;font-size:18px}
.line[aria-pressed="true"]{background:var(--mint-bg)}
.shead,.shead.big{font-weight:800;border-radius:18px}
.shead.big{font-size:26px}
.spick button{border-radius:14px}
.spick b{font-weight:800}
th{font-weight:800;color:var(--muted)}
.seg{border:1.5px solid var(--line);border-radius:999px;background:#fff}
.seg button{font-weight:700;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--choc);color:#fff}
.alert{border-radius:18px}
.alert b{font-weight:800;font-size:18px}
.pill{font-weight:700}
.paper .ring{display:none}
.paper .logoimg{height:64px;width:auto}
.th{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff;box-shadow:0 3px 10px rgba(59,31,20,.15)}
.th.ph{display:grid;place-items:center;background:var(--berry-bg);color:var(--berry);font-weight:900;font-size:16px;letter-spacing:.02em}
.orow{justify-content:flex-start}.orow .d{flex:1}
.orow .step{margin-left:auto}
@media (max-width:520px){.th{width:44px;height:44px}.orow{gap:10px;padding:10px 10px}.orow .d b{font-size:16px}
.brand img{height:40px}.brand{font-size:20px}.huge{font-size:72px}.orow .step output{font-size:26px}}
.kpi b{overflow-wrap:normal!important;white-space:nowrap;font-size:clamp(22px,2.5vw,32px)!important}
/* ---- 15-day review reminder ---- */
.alert.remind{background:var(--berry-bg);color:var(--choc);border:2px solid var(--berry)}
.alert.remind b{color:var(--berry)}
.pend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--berry-bg);border-radius:16px;padding:10px 14px;font-size:14px}
.pend b{margin-right:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(42,21,13,.45);display:grid;place-items:center;padding:20px max(20px,env(safe-area-inset-left,0px))}
.mbox{background:#fff;border-radius:26px;max-width:440px;width:100%;padding:28px 24px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox .bell{width:72px;height:72px;border-radius:50%;background:var(--berry-bg);display:grid;place-items:center;font-size:36px;margin:0 auto 12px}
.mbox h2{font-size:24px;font-weight:900}
.mbox p{color:var(--muted);margin:10px 0 18px}
.mact{display:grid;gap:10px}
/* ---- entry, PIN login and kitchen TV ---- */
.f input[data-c="pinset"]{flex:none;width:84px;text-align:center;letter-spacing:.18em;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px}
.f label .row{flex-wrap:nowrap;gap:8px}
.whoami{display:flex;align-items:center;gap:8px}
.whoami:empty{display:none}
.whoami .me{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--choc);background:var(--berry-bg);border-radius:999px;padding:6px 12px}
.whoami .me i{width:10px;height:10px;border-radius:50%;display:inline-block}
.whoami .btn{padding:6px 12px;font-size:14px}
body.bare nav#nav{display:none}
.start{max-width:980px;margin:0 auto;text-align:center;padding-top:clamp(8px,3vw,28px)}
.start h1{font-size:clamp(34px,5.4vw,52px)}
.start .sub{font-size:17px}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px;text-align:left}
.role{text-align:left;border:0;border-radius:24px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;cursor:pointer;color:var(--choc);font:inherit;transition:transform .12s}
.role:hover{transform:translateY(-3px)}
.role .ic{grid-row:span 2;width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 6px 16px rgba(59,31,20,.12)}
.role b{font-family:var(--script);font-weight:400;font-size:30px;line-height:1.1}
.role span{color:var(--muted);font-size:15px}
.r1{background:#FDE3EE}.r1 b{color:#C92D74}.r2{background:#FBEBCF}.r2 b{color:#A86A1E}.r3{background:#E2EEFB}.r3 b{color:#2F5F98}.r4{background:#EDE4FA}.r4 b{color:#6B48A8}
.tvlink{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--choc);color:#fff;border-radius:22px;padding:18px 22px;cursor:pointer;border:0;font:inherit;width:100%}
.tvlink b{font-size:20px;font-weight:900}
.tvlink span{color:#e9d6c8;font-size:15px}
@media (max-width:640px){.roles{grid-template-columns:1fr}.role .ic{width:54px;height:54px;font-size:26px}}
.pinwrap{max-width:420px;margin:0 auto;text-align:center}
.pinwrap .who{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(26px,5vw,34px);letter-spacing:-.02em;margin-top:6px}
.pinwrap .who i{width:18px;height:18px;border-radius:50%;display:inline-block}
.dots{display:flex;justify-content:center;gap:16px;margin:26px 0 8px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--choc);display:block}
.dots i.on{background:var(--berry);border-color:var(--berry)}
.dots.err i{border-color:#c0392b;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pinmsg{min-height:24px;font-weight:700;color:#c0392b}
.pinhint{color:var(--muted);font-size:14px;margin-top:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.pad button{height:76px;border-radius:20px;border:0;background:#fff;box-shadow:0 6px 16px rgba(59,31,20,.08);font:900 30px var(--body);color:var(--choc);cursor:pointer}
.pad button:active{background:var(--berry-bg)}
.pad button.k2{font-size:16px;font-weight:700;color:var(--muted)}
.backlink{margin-top:22px;background:none;border:0;font:700 15px var(--body);color:var(--muted);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.dots.err i{animation:none}.role{transition:none}}
/* TV */
body.tvmode .band,body.tvmode #toast{display:none}
body.tvmode main{padding:0}
body.tvmode main .in{max-width:none}
.tv{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);padding:clamp(14px,2vw,28px)}
.tvtop{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tvtop img{height:clamp(46px,5vw,72px);width:auto}
.tvtop .ttl{font-weight:900;font-size:clamp(22px,2.6vw,38px);letter-spacing:-.02em}
.tvtop .ttl small{display:block;font-weight:700;font-size:clamp(13px,1.2vw,18px);color:var(--muted);letter-spacing:0}
.tvtop .clock{margin-left:auto;font-weight:900;font-size:clamp(30px,4vw,60px);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tvtop .btn{font-size:14px;padding:8px 14px}
.tvsnow{background:var(--snow-bg);color:var(--snow);border-radius:18px;padding:12px 18px;font-weight:800;font-size:clamp(16px,1.6vw,24px)}
.tvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(12px,1.6vw,22px);flex:1}
.tvcol{background:#fff;border-radius:24px;padding:clamp(14px,1.8vw,26px);box-shadow:0 10px 30px rgba(59,31,20,.07);display:flex;flex-direction:column;gap:clamp(8px,1vw,14px);min-width:0}
.tvcol h2{font-family:var(--script);font-weight:400;font-size:clamp(26px,2.6vw,40px);letter-spacing:0;color:var(--berry)}
.drow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;border-radius:18px;padding:clamp(10px,1.2vw,16px) clamp(12px,1.4vw,20px)}
.drow:nth-child(5n+2){background:#FDE3EE}.drow:nth-child(5n+3){background:#FBEBCF}.drow:nth-child(5n+4){background:#E2EEFB}.drow:nth-child(5n+5){background:#EDE4FA}.drow:nth-child(5n+6){background:#DFF3EA}
.drow b{font-weight:800;font-size:clamp(17px,1.7vw,26px)}
.drow small{color:var(--muted);font-weight:700;font-size:clamp(13px,1.1vw,17px)}
.drow .n{grid-row:span 2;font-weight:900;font-size:clamp(38px,4.6vw,76px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.drow.done{opacity:.55}.drow.done .n::after{content:" ✓";color:var(--mint);font-size:.6em}
.tvstores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
.tst{border-radius:16px;padding:clamp(10px,1vw,14px);color:#fff;display:flex;flex-direction:column;gap:6px;min-height:clamp(92px,9vw,128px)}
.tst b{font-weight:800;font-size:clamp(14px,1.25vw,19px);line-height:1.2}
.tst .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:auto}
.tst .bar i{display:block;height:100%;background:#fff;border-radius:5px}
.tst small{font-weight:700;font-size:clamp(12px,1vw,15px);opacity:.95}
.tst.ok{outline:4px solid var(--mint);outline-offset:-4px}
.tvsum{display:flex;gap:clamp(10px,1.4vw,22px);flex-wrap:wrap}
.tvsum div{font-weight:700;color:var(--muted);font-size:clamp(13px,1.1vw,17px)}
.tvsum b{display:block;font-weight:900;font-size:clamp(26px,2.8vw,44px);color:var(--choc);letter-spacing:-.03em;line-height:1.05}
@media (max-width:900px){.tvgrid{grid-template-columns:1fr}.tvstores{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ==== Practical layer: neutral, compact, one accent ==== */
:root{
  --bg:#F5F4F2; --surface:#ffffff; --ink:#1E1916; --muted:#6B625C; --line:#E4E0DC; --line2:#D3CDC7;
  --band:#ffffff; --band-ink:#1E1916; --band-muted:#6B625C;
  --berry:#D9337F; --berry-ink:#ffffff; --berry-bg:#FBEAF2; --choc:#1E1916;
  --mint:#167A55; --mint-bg:#E6F4EC; --warn:#8A5300; --warn-bg:#FDF1DC; --snow:#1F5F9E; --snow-bg:#E7F0FA;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --script:var(--body); --r:10px;
}
body{font-size:14px;font-feature-settings:"cv11","tnum"}
.ico{display:inline-block;vertical-align:middle;flex:none}
/* header */
.band{border-bottom:1px solid var(--line)}
.band .in{padding-block:8px 0;gap:8px 16px}
.brand{font-family:var(--body);font-weight:700;font-size:16px;color:var(--ink);gap:12px;letter-spacing:-.01em}
.brand img{height:38px}
.brand span{display:flex;flex-direction:column;line-height:1.15;padding-left:12px;border-left:1px solid var(--line)}
.brand small{font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--muted)}
nav button{font-weight:600;font-size:14px;padding:10px 12px 9px;border-bottom-width:2px}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--berry)}
.lang button{font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px}
.lang button[aria-pressed="true"]{border-color:var(--line2);color:var(--ink);background:var(--bg)}
.whoami .me{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-weight:600;font-size:13px;padding:5px 10px}
.whoami .btn{font-size:13px;padding:5px 10px}
main{padding-block:20px 56px}
/* type */
h1{font-weight:700;font-size:clamp(20px,2.6vw,26px);letter-spacing:-.015em}
h2{font-weight:650;font-size:16px;letter-spacing:-.005em}
.sub{font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted)}
/* surfaces: flat, bordered */
.card,.kpi,.panel,.orow,.scroll{border:1px solid var(--line);box-shadow:none;border-radius:var(--r)}
.card{border-radius:var(--r)}
.btn{border-radius:8px;font-weight:600;border:1px solid var(--line2);padding:7px 12px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--berry);border-color:var(--berry)}
.btn.pri:hover{background:#BE2A6E;border-color:#BE2A6E}
.btn.big{font-size:15px;padding:12px 16px;border-radius:8px}
.seg{border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
.seg button{border-radius:0;font-weight:600;font-size:13px;padding:7px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pill{font-weight:600;font-size:12px;border-radius:6px;padding:3px 9px}
.alert{border-radius:var(--r);border-left:4px solid currentColor;padding:12px 14px}
.alert b{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.alert.remind{background:var(--berry-bg);color:var(--ink);border:1px solid #F3C6DA;border-left:4px solid var(--berry)}
.alert.remind b{color:var(--ink)}
.pend .pill{font-weight:500;padding:2px 8px}
.pend{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--berry);border-radius:var(--r);font-size:13px}
.pend b{display:inline-flex;align-items:center;gap:6px}
.kpi b{font-weight:700!important;letter-spacing:-.02em;font-size:clamp(20px,2.2vw,28px)!important}
.kpi span{font-size:12px}
.bar{height:8px;border-radius:2px}
/* store order */
.th{width:40px;height:40px;border:0;box-shadow:none;border-radius:8px}
.th.ph{border-radius:8px;background:var(--bg);color:var(--muted);font-weight:700;font-size:13px}
.olist{gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.orow{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:10px 14px;gap:12px}
.orow:last-child{border-bottom:0}
.orow .d b{font-weight:600;font-size:15px}
.orow small{font-size:12px}
.orow .step button{width:40px;height:40px;border-radius:8px;background:var(--surface);border:1px solid var(--line2);color:var(--ink);font-size:20px;font-weight:500}
.orow .step button:hover:not([disabled]){border-color:var(--ink)}
.orow .step output{font-weight:700;font-size:22px;min-width:64px;letter-spacing:-.01em}
.totbar{background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 16px;font-weight:500;font-size:13px}
.totbar b{font-weight:700;font-size:26px}
.totbar span:last-child{display:inline-flex;align-items:center;gap:6px;color:#BFE7D2}
.std input{border-radius:6px}
/* baker */
.bk{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bk .card,.bk .card:nth-child(n){background:var(--surface);padding:18px;gap:8px;border:1px solid var(--line)}
.dough,.bk .dough{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.huge{font-weight:700;font-size:clamp(52px,6vw,72px);letter-spacing:-.04em;line-height:1}
.batch,.bk .batch{font-weight:500;font-size:14px;color:var(--muted)}
.card.done{background:var(--mint-bg)!important;outline:0;border-color:#BFE3CF!important;border-left:4px solid var(--mint)!important}
.okbig{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
/* finishers */
.spick{gap:6px}
.spick button,.spick button[aria-pressed]{background:var(--surface)!important;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--sc,var(--line2));border-radius:8px;opacity:1;padding:8px 10px}
.spick button:hover{border-color:var(--line2);border-left-color:var(--sc)}
.spick button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:0}
.spick b{font-weight:600;font-size:13px}.spick small{color:var(--muted);font-size:12px}
.pickbig{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.pickbig button{padding:12px 14px}.pickbig b{font-size:15px}
.shead,.shead.big{background:var(--surface)!important;color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:var(--r);font-weight:700;font-size:20px;padding:12px 16px}
.shead span:last-child{color:var(--muted);font-weight:500}
.flist{gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.flist .line{border:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line);background:var(--surface);padding:12px 14px}
.flist .line:last-child{border-bottom:0}
.flist .line .q{font-weight:700;font-size:28px;min-width:72px}
.flist .line .d b{font-weight:600;font-size:16px}
.flist .line .d small{font-size:13px}
.flist .line .ck{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--line2);font-size:16px}
.line[aria-pressed="true"]{background:var(--mint-bg)!important}
/* entry */
.start{max-width:720px;text-align:left}
.start h1{font-size:clamp(24px,3vw,30px)}
.start .sub{font-size:15px}
.roles{grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.role,.role.r1,.role.r2,.role.r3,.role.r4{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;grid-template-columns:auto 1fr auto;gap:14px;transition:border-color .12s}
.role:hover{transform:none;border-color:var(--ink)}
.role .ic{grid-row:auto;width:44px;height:44px;border-radius:8px;background:var(--bg);box-shadow:none;color:var(--ink)}
.role .rt{display:flex;flex-direction:column;gap:2px;min-width:0}
.role b,.role.r1 b,.role.r2 b,.role.r3 b,.role.r4 b{font-family:var(--body);font-weight:650;font-size:16px;color:var(--ink)}
.role .rt span{font-size:13px;color:var(--muted)}
.role>.ico{color:var(--line2)}
.role:hover>.ico{color:var(--ink)}
.tvlink{margin-top:10px;background:var(--surface);color:var(--ink);border:1px dashed var(--line2);border-radius:var(--r);padding:12px 16px;justify-content:flex-start;gap:10px}
.tvlink b{font-size:14px;font-weight:650;display:inline-flex;align-items:center;gap:8px}
.tvlink span{color:var(--muted);font-size:13px}
.tvlink:hover{border-color:var(--ink);border-style:solid}
@media (max-width:640px){.roles{grid-template-columns:1fr}.role .ic{width:40px;height:40px}}
.pinwrap{max-width:340px}
.pinwrap .who{font-weight:700;font-size:22px;gap:8px}
.pinwrap .who i{width:12px;height:12px}
.dots{gap:12px;margin:20px 0 6px}
.dots i{width:14px;height:14px;border:2px solid var(--line2)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{gap:8px}
.pad button{height:60px;border-radius:8px;border:1px solid var(--line);box-shadow:none;font:600 22px var(--body);color:var(--ink)}
.pad button:hover{border-color:var(--line2)}
.pad button:active{background:var(--bg)}
.pad button.k2{font-size:13px;font-weight:600}
.backlink{font:600 14px var(--body);text-decoration:none}
.backlink:hover{color:var(--ink)}
/* reminder dialog */
.mbox{border-radius:12px;padding:22px 20px 16px;text-align:left}
.mbox .bell{width:40px;height:40px;border-radius:8px;margin:0 0 12px;color:var(--berry)}
.mbox h2{font-size:18px;font-weight:700}
.mbox p{margin:6px 0 16px;font-size:14px}
.mact{gap:8px}
.mact .backlink{text-align:center}
/* weather */
.wx div{border-radius:6px}
.wx .g{display:flex;justify-content:center;color:var(--muted);margin:2px 0}
.wx div.sn .g{color:var(--snow)}
/* paper */
.paper{box-shadow:0 1px 3px rgb(0 0 0 / .06)}
/* kitchen TV: dark board for reading across the room */
.tv{--tbg:#14110F;--tcard:#201B18;--tline:#352D28;--tink:#F6F1EC;--tmut:#A3968D;background:var(--tbg);color:var(--tink)}
.tvtop .ttl small,.tvsum div{color:var(--tmut)}
.tvtop img{background:#fff;border-radius:8px;padding:4px 8px;height:clamp(40px,4vw,60px)}
.tvtop .ttl{font-weight:700}
.tvtop .clock{font-weight:700}
.tvtop .btn{background:transparent;color:var(--tink);border-color:var(--tline)}
.tvtop .btn:hover{border-color:var(--tink)}
.tvsnow{background:#13314F;color:#D4E6FA;border-radius:8px;border-left:4px solid #6FA8E0;display:flex;align-items:center;gap:10px;font-weight:600}
.tvsum b{color:var(--tink);font-weight:700}
.tvcol{background:var(--tcard);border:1px solid var(--tline);border-radius:12px;box-shadow:none}
.tvcol h2{font-family:var(--body);font-weight:600;font-size:clamp(13px,1.1vw,16px);letter-spacing:.08em;text-transform:uppercase;color:var(--tmut)}
.drow,.drow:nth-child(n){background:transparent;border-radius:0;border-top:1px solid var(--tline);padding:clamp(8px,1vw,14px) 2px}
.drow b{font-weight:600}
.drow small{color:var(--tmut);font-weight:500}
.drow .n{font-weight:700}
.drow.done{opacity:.45}
.tst{background:#2A2320!important;color:var(--tink);border-radius:8px;border-left:5px solid var(--sc)}
.tst b{font-weight:600}
.tst small{color:var(--tmut);opacity:1}
.tst .bar{height:6px;border-radius:3px;background:var(--tline)}
.tst .bar i{background:#4CC38A;border-radius:3px}

const LOC=['en-US','pt-BR','es-US'];
let li=0;
function t(k,...a){let s=(T[k]||[k])[li];a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)});return s}

/* ---------- state ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function genStd(){const r=rng(16),o={};STORES.forEach(s=>{const size=.6+r()*.9;o[s.id]={};FLAV.forEach(f=>{const v=f.pop*size*(.8+r()*.4);o[s.id][f.id]=WDF.map(w=>Math.max(0,Math.round(v*w))*12)})});return o}
const NOW=new Date(),TOM=new Date(NOW);TOM.setDate(TOM.getDate()+1);
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function fresh(){return{v:1,day:dkey(NOW),lang:0,view:'start',who:null,loginFor:null,store:null,sub:'day',adm:'log',invSel:null,
 cfg:{cutoffH:2,prodStart:'14:00',now:'10:30',snowIn:2,cutPct:30,sim:false,
  batch:{yeast:144,choc:96,plain:96,blue:72,crul:72},price:Object.fromEntries(FLAV.map(f=>[f.id,f.fill?1.15:f.top.length>1?1.05:.95]))},
 std:genStd(),adj:{},baked:{},packed:{},ship:{},left:{},inv:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem('gd-kitchen-demo'));if(s&&s.v===1){if(s.day!==dkey(NOW)){s.day=dkey(NOW);s.adj={};s.baked={};s.packed={};s.ship={}}return s}}catch(e){}return null}
function save(){try{localStorage.setItem('gd-kitchen-demo',JSON.stringify(S))}catch(e){}}
let S=load()||fresh();li=S.lang;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const num=n=>Math.round(n).toLocaleString(LOC[li]);
const usd=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});
const dfmt=(d,o)=>d.toLocaleDateString(LOC[li],o||{weekday:'long',month:'short',day:'numeric'});
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
function tfmt(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');if(li===0){return((h+11)%12+1)+':'+mm+(h<12?' AM':' PM')}return String(h).padStart(2,'0')+':'+mm}
const cutoff=()=>toMin(S.cfg.prodStart)-S.cfg.cutoffH*60;
const locked=()=>toMin(S.cfg.now)>=cutoff();
const WT=TOM.getDay();
const stdQ=(s,f)=>S.std[s][f][WT];
const ord=(s,f)=>{const a=S.adj[s];return a&&a[f]!=null?a[f]:stdQ(s,f)};
const storeTot=s=>FLAV.reduce((a,f)=>a+ord(s,f.id),0);
const doughTot=d=>FLAV.filter(f=>f.d===d).reduce((a,f)=>a+STORES.reduce((b,s)=>b+ord(s.id,f.id),0),0);
const lines=s=>FLAV.filter(f=>ord(s,f.id)>0);
const allPacked=s=>{const l=lines(s);return l.length>0&&l.every(f=>S.packed[s]&&S.packed[s][f.id])};
const stage=s=>{const x=S.ship[s];return x?x.st:allPacked(s)?1:0};
function hist(si,fi,k){const d=new Date(NOW);d.setDate(d.getDate()-k);const base=S.std[STORES[si].id][FLAV[fi].id][d.getDay()];const x=Math.sin(si*97.1+fi*13.7+k*7.3)*43758.5;return Math.round(base*(.85+.3*(x-Math.floor(x)))/12)*12}
let HC=null;
function H(){if(HC)return HC;HC=STORES.map((s,si)=>FLAV.map((f,fi)=>{let a=0;for(let k=1;k<=14;k++)a+=hist(si,fi,k);return a}));return HC}
const invTot=si=>H()[si].reduce((a,q,fi)=>a+q*S.cfg.price[FLAV[fi].id],0);
function periodTxt(){const a=new Date(NOW),b=new Date(NOW);a.setDate(a.getDate()-14);b.setDate(b.getDate()-1);const o={month:'short',day:'numeric'};return dfmt(a,o)+' – '+dfmt(b,o)}
function finish(f){const p=[];if(f.fill)p.push(t('fillL')+': '+t('p_'+f.fill));if(f.top.length)p.push(t('topL')+': '+f.top.map(x=>t('p_'+x)).join(' + '));return p.length?p.join(' · '):t('noFin')}
let toastT;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- weather ---------- */
let WX=null,WXLIVE=false;
function sampleWx(){const sn={s4:3.1,s9:2.6,s8:1.2};return Object.fromEntries(STORES.map((s,i)=>[s.id,[
 {sn:0,hi:38-(i%3),lo:27-(i%4),code:3},{sn:sn[s.id]||(i%5===0?.3:0),hi:33-(i%3),lo:21-(i%4),code:sn[s.id]?73:3},{sn:0,hi:36-(i%2),lo:19-(i%3),code:1}]]))}
WX=sampleWx();
function loadWx(){const u='https://api.open-meteo.com/v1/forecast?latitude='+STORES.map(s=>s.lat).join(',')+'&longitude='+STORES.map(s=>s.lon).join(',')+'&daily=weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FNew_York&forecast_days=3';
 fetch(u).then(r=>r.json()).then(j=>{if(!Array.isArray(j)||j.length!==STORES.length)return;const o={};j.forEach((x,i)=>{const d=x.daily;o[STORES[i].id]=[0,1,2].map(k=>({sn:d.snowfall_sum[k]||0,hi:Math.round(d.temperature_2m_max[k]),lo:Math.round(d.temperature_2m_min[k]),code:d.weather_code[k]}))});WX=o;WXLIVE=true;render()}).catch(()=>{})}
function wx(s,k){const i=STORES.findIndex(x=>x.id===s);const w=WX[s][k];if(S.cfg.sim&&k===1)return{sn:6+(i%4)*2,hi:28,lo:14,code:75};return w}
const glyph=w=>w.sn>0||(w.code>=71&&w.code<=77)||w.code===85||w.code===86?ico('snow',22):w.code>=95?ico('bolt',22):w.code>=51?ico('rain',22):w.code>=2?ico('cloud',22):ico('sun',22);
const wxLabel=()=>S.cfg.sim?t('sim'):WXLIVE?t('live')+' · Open-Meteo':t('sample');

/* ---------- views ---------- */
function vStores(){

 const lock=locked(),w=wx(st.id,1),c=cutoff();
 let h=`<div class="head"><div><h1><span class="dot" style="background:${st.c};width:12px;height:12px;vertical-align:middle"></span> ${st.n}</h1><p class="sub">${t('delivery',dfmt(TOM))}</p></div>
 <div class="row">${S.who&&S.who.role==='office'?`<button class="btn" data-a="pickStore" data-s="">${t('chg')}</button>`:''}
 <span class="pill ${lock?'warn':'ok'}">${lock?t('locked',tfmt(c)):t('open',tfmt(c))}</span></div></div><div class="stack">`;
 if(needsReview(st.id))h+=`<div class="alert remind"><div><b>${ico('bell',18)} ${t('rvT')}</b><br>${t('rvD',qzTxt())}</div><div class="row"><button class="btn pri" data-a="rvNow">${t('rvNow')}</button><button class="btn" data-a="rvKeep">${t('rvKeep')}</button></div></div>`;
 if(lock)h+=`<div class="alert lock"><div><b>${t('lockT')}</b><br>${t('lockD',tfmt(toMin(S.cfg.prodStart)),S.cfg.cutoffH)}</div></div>`;
 if(w.sn>=S.cfg.snowIn)h+=`<div class="alert snow"><div><b>${ico('snow',18)} ${t('snowT',w.sn.toFixed(1))}</b><br>${t('snowD')}</div>
 <button class="btn pri" data-a="cut"${lock?' disabled':''}>${t('cut',S.cfg.cutPct)}</button></div>`;
 h+=`<div class="row"><div class="seg"><button data-a="sub" data-v="day" aria-pressed="${S.sub==='day'}">${t('dayTab')}</button><button data-a="sub" data-v="std" aria-pressed="${S.sub==='std'}">${t('stdTab')}</button></div>
 ${S.sub==='day'?`<button class="btn" data-a="resetDay"${lock?' disabled':''}>${t('reset')}</button>`:''}</div>`;
 if(S.sub==='day'){
  const to=storeTot(st.id);

  <button class="role" data-a="role" data-v="office"><span class="ic">${ico('office',22)}</span><span class="rt"><b>${t('rOff')}</b><span>${t('rOffD')}</span></span>${ico('chev',18)}</button>
 </div>
 <button class="tvlink" data-a="nav" data-v="tv"><b>${ico('tv',18)} ${t('tvL')}</b><span>${t('tvLD')}</span></button></div>`}
function vPickStore(){return `<div class="head"><div><h1>${t('pickYour')}</h1><p class="sub">${t('whoD')}</p></div></div>
 <div class="spick pickbig">${STORES.map(s=>`<button data-a="loginStore" data-s="${s.id}" style="--sc:${s.c}"><b>${s.n}</b><small>${s.a}</small></button>`).join('')}</div>
 <div style="text-align:center"><button class="backlink" data-a="toStart">← ${t('back')}</button></div>`}
function vLogin(){const lf=S.loginFor||{role:'office'};const st=lf.role==='store'&&STORES.find(s=>s.id===lf.store);
 return `<div class="pinwrap"><p class="sub">${t('pinT')}</p>
 <div class="who">${st?`<i style="background:${st.c}"></i>${st.n}`:roleName(lf.role)}</div>
 <div class="dots${pinErr?' err':''}" aria-label="${pinBuf.length} / 4">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
 <div class="pinmsg" role="alert">${pinErr?t('pinBad'):''}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="pin" data-v="${n}">${n}</button>`).join('')}<button class="k2" data-a="pinClr">${t('clr')}</button><button data-a="pin" data-v="0">0</button><button class="k2" data-a="pinDel" aria-label="${t('back')}">⌫</button></div>
 <p class="pinhint">${t('pinHint',pinFor(lf))}</p>
 <button class="backlink" data-a="${lf.role==='store'?'role':'toStart'}" data-v="store">← ${t('back')}</button></div>`}
function vTv(){
 const now=new Date(),clock=now.toLocaleTimeString(LOC[li],{hour:'numeric',minute:'2-digit'});
 const tot=STORES.reduce((a,s)=>a+storeTot(s.id),0),bakedN=DOUGHS.filter(d=>S.baked[d]===doughTot(d)).length,packedN=STORES.filter(s=>allPacked(s.id)).length;
 const snowN=STORES.filter(s=>wx(s.id,1).sn>=S.cfg.snowIn).length;
 return `<div class="tv"><div class="tvtop"><img src="${document.querySelector('.brand img').src}" alt="Gourmet Donuts"><div class="ttl">${t('tvTitle')}<small>${t('tvSub',dfmt(TOM))}</small></div>
  <div class="clock" id="tvclock">${clock}</div><button class="btn" data-a="tvFull">${ico('full',16)} ${t('tvFull')}</button><button class="btn" data-a="tvExit">${t('exit')}</button></div>
  ${snowN?`<div class="tvsnow">${ico('snow',26)}${t('tvSnow',snowN)}</div>`:''}
  <div class="tvsum"><div><b>${num(tot)}</b>${t('tvTot')}</div><div><b>${bakedN}/${DOUGHS.length}</b>${t('tvBaked')}</div><div><b>${packedN}/${STORES.length}</b>${t('tvPacked')}</div></div>
  <div class="tvgrid">
   <div class="tvcol"><h2>${t('tvDough')}</h2>${DOUGHS.map(d=>{const n=doughTot(d),bs=S.cfg.batch[d],nb=Math.ceil(n/bs),done=S.baked[d]===n;return `<div class="drow${done?' done':''}"><b>${t('d_'+d)}</b><span class="n">${num(n)}</span><small>${t(nb===1?'batch1':'batches',nb,bs)}</small></div>`}).join('')}</div>
   <div class="tvcol"><h2>${t('tvStores')}</h2><div class="tvstores">${STORES.map(s=>{const l=lines(s.id),p=l.filter(f=>S.packed[s.id]&&S.packed[s.id][f.id]).length,ok=allPacked(s.id),g=stage(s.id);
    return `<div class="tst${ok?' ok':''}" style="--sc:${s.c}"><b>${s.n}</b><small>${g>=2?t('st'+g):t('tvLines',p,l.length)}</small><div class="bar"><i style="width:${l.length?p/l.length*100:0}%"></i></div></div>`}).join('')}</div></div>
  </div></div>`}
const VIEWS={start:vStart,pick:vPickStore,login:vLogin,stores:vStores,baker:vBaker,finishers:vFin,admin:vAdmin,config:vConfig,tv:vTv};
const NAV_ALL=[['stores','stores'],['baker','baker'],['finishers','fin'],['admin','admin'],['config','config'],['tv','tvL']];
const OPEN=['start','pick','login','tv'];
function allowed(v){if(OPEN.includes(v))return true;return !!(S.who&&ROLE_VIEWS[S.who.role].includes(v))}
function render(){
 document.documentElement.lang=LOC[li].slice(0,2);
 $('lang').innerHTML=['EN','PT','ES'].map((x,i)=>`<button data-a="lang" data-v="${i}" aria-pressed="${i===li}">${x}</button>`).join('');
 if(!allowed(S.view))S.view=S.who?ROLE_HOME[S.who.role]:'start';
 const bare=!S.who||['start','pick','login'].includes(S.view);
 document.body.classList.toggle('bare',bare);document.body.classList.toggle('tvmode',S.view==='tv');
 const NAV=S.who?NAV_ALL.filter(x=>ROLE_VIEWS[S.who.role].includes(x[0])):[];
 $('nav').innerHTML=NAV.length>1?NAV.map(x=>`<button data-a="nav" data-v="${x[0]}"${S.view===x[0]?' aria-current="page"':''}>${t(x[1])}</button>`).join(''):'';
 const ws=S.who&&S.who.role==='store'&&STORES.find(s=>s.id===S.who.store);
 $('whoami').innerHTML=S.who?`<span class="me">${ws?`<i style="background:${ws.c}"></i>${ws.n}`:roleName(S.who.role)}</span><button class="btn" data-a="logout">${t('exit')}</button>`:'';
 $('app').innerHTML=(VIEWS[S.view]||vStart)();
 const ws2=S.who&&S.who.role==='store'&&S.who.store;
 if(S.pop&&S.view==='stores'&&ws2&&needsReview(ws2))$('app').insertAdjacentHTML('beforeend',`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rvh"><div class="mbox"><div class="bell" aria-hidden="true">${ico('bell',22)}</div><h2 id="rvh">${t('rvT')}</h2><p>${t('rvD',qzTxt())}</p><div class="mact"><button class="btn pri big" data-a="rvNow">${t('rvNow')}</button><button class="btn big" data-a="rvKeep">${t('rvKeep')}</button><button class="backlink" data-a="rvLater">${t('rvLater')}</button></div></div></div>`);
 const sel=document.querySelector&&document.querySelector('.spick:not(.pickbig) [aria-pressed="true"]'),bar=sel&&sel.parentNode;
 if(bar&&bar.scrollWidth>bar.clientWidth)bar.scrollLeft=sel.offsetLeft-bar.offsetLeft-(bar.clientWidth-sel.offsetWidth)/2;
}

/* ---------- actions ---------- */
function setAdj(s,f,v){(S.adj[s]=S.adj[s]||{})[f]=v;if(S.packed[s])delete S.packed[s][f]}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset,st=S.store;
 switch(d.a){
  case'lang':li=S.lang=+d.v;break;
  case'nav':S.view=d.v;setHash();window.scrollTo(0,0);break;
  case'sub':S.sub=d.v;break; case'adm':S.adm=d.v;break;
  case'q':if(locked())return;setAdj(st,d.f,Math.max(0,ord(st,d.f)+ +d.d));toast(t('saved'));break;
  case'cut':if(locked())return;FLAV.forEach(f=>setAdj(st,f.id,Math.max(0,Math.round(stdQ(st,f.id)*(1-S.cfg.cutPct/100)/12)*12)));toast(t('cutDone',S.cfg.cutPct));break;
  case'resetDay':delete S.adj[st];toast(t('saved'));break;
  case'bake':S.baked[d.d]=doughTot(d.d);break; case'unbake':delete S.baked[d.d];break;
  case'pack':{const p=S.packed[d.s]=S.packed[d.s]||{};p[d.f]?delete p[d.f]:p[d.f]=1;break}
  case'ship':S.ship[d.s]={st:+d.v,t:tfmt(new Date().getHours()*60+new Date().getMinutes())};break;
  case'invSel':S.invSel=d.s;render();save();{const p=$('paper');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}return;
  case'invSt':S.inv[d.s]=+d.v;break;
  case'tpl':S.tpl=+d.v;break;
  case'pal':S.pal=+d.v;break;
  case'pickStore':S.store=d.s||null;setHash();window.scrollTo(0,0);break;
  case'role':if(d.v==='store'){S.view='pick'}else if(d.v==='office'){S.loginFor={role:'office'};pinBuf='';pinErr=false;S.view='login'}else{S.who={role:d.v};S.view=ROLE_HOME[d.v]}setHash();window.scrollTo(0,0);break;
  case'toStart':S.view='start';pinBuf='';pinErr=false;setHash();break;
  case'loginStore':S.loginFor={role:'store',store:d.s};pinBuf='';pinErr=false;S.view='login';setHash();window.scrollTo(0,0);break;
  case'pin':if(pinBuf.length<4){pinBuf+=d.v;pinErr=false}
   if(pinBuf.length===4){const lf=S.loginFor||{role:'office'};const ok=pinBuf===pinFor(lf);
    if(ok){S.who=lf.role==='store'?{role:'store',store:lf.store}:{role:'office'};S.pop=lf.role==='store';if(lf.role==='store')S.store=lf.store;S.view=ROLE_HOME[lf.role];pinBuf='';setHash();window.scrollTo(0,0)}else{pinErr=true;pinBuf=''}}break;
  case'rvNow':S.sub='std';S.pop=false;window.scrollTo(0,0);break;
  case'rvKeep':markReviewed(S.store);toast(t('rvDone'));break;
  case'rvLater':S.pop=false;break;
  case'pinDel':pinBuf=pinBuf.slice(0,-1);pinErr=false;break;
  case'pinClr':pinBuf='';pinErr=false;break;
  case'logout':S.who=null;S.view='start';S.store=null;pinBuf='';setHash();window.scrollTo(0,0);break;
  case'tvFull':{const el=document.documentElement;try{const r=document.fullscreenElement?document.exitFullscreen():el.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(x){}}return;
  case'tvExit':try{if(document.fullscreenElement)document.exitFullscreen()}catch(x){}S.view=S.who?ROLE_HOME[S.who.role]:'start';setHash();break;
  case'fs':S.fs=d.s;window.scrollTo(0,0);break;
  case'sendAll':STORES.forEach(s=>{if(!S.inv[s.id])S.inv[s.id]=1});toast(t('sentAll'));break;
  case'wipe':{const pl=S.pal,w=S.who;S=fresh();S.pal=pl;S.lang=li;S.who=w;}S.view='config';HC=null;toast(t('resetOk'));break;
 }
 save();render();
});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset;if(!d.c)return;
 if(d.c==='pinset'){const v=el.value.trim();if(!/^\d{4}$/.test(v)){toast(t('pinFmt'));render();return}
  if(d.k==='office')S.cfg.officePin=v;else{(S.cfg.pins=S.cfg.pins||DEFAULT_PINS())[d.k]=v}save();toast(t('pinSaved'));return}
 const v=Math.max(0,parseFloat(el.value)||0);
 switch(d.c){
  case'store':S.store=el.value;break;
  case'std':S.std[S.store][d.f][+d.w]=Math.round(v);HC=null;toast(t('saved'));break;
  case'left':S.left[d.s]=Math.round(v);break;
  case'cfg':S.cfg[d.k]=v;break; case'cfgT':if(el.value)S.cfg[d.k]=el.value;break;
  case'sim':S.cfg.sim=el.checked;break;
  case'remind':S.cfg.remind=el.checked;break;
  case'batch':S.cfg.batch[d.k]=Math.max(12,Math.round(v));break;
  case'price':S.cfg.price[d.k]=v;break;
 }
 save();render();
});
function setHash(){try{const h=S.view==='stores'&&S.store?'store-'+S.store.slice(1):S.view==='login'&&S.loginFor&&S.loginFor.role==='store'?'store-'+S.loginFor.store.slice(1):S.view;if(location.hash.slice(1)!==h)location.hash=h}catch(x){}}
function readHash(){const h=(location.hash||'').slice(1),m=/^store-(\d+)$/.exec(h);
 if(m&&STORES[m[1]-1]){const id='s'+m[1];if(S.who&&(S.who.role==='office'||(S.who.role==='store'&&S.who.store===id))){S.view='stores';S.store=id}else{S.loginFor={role:'store',store:id};pinBuf='';pinErr=false;S.view='login'}return true}
 if(VIEWS[h]){S.view=h;return true}return false}
window.addEventListener('hashchange',()=>{if(readHash())render()});
if(!readHash()&&!S.who)S.view='start';
render();loadWx();
// kitchen TV: refresh every 5 s from what this device saved (the real system reads the shared database)
setInterval(()=>{if(S.view!=='tv')return;const n=load();if(n){const keep=S.view;S.adj=n.adj;S.baked=n.baked;S.packed=n.packed;S.ship=n.ship;S.std=n.std;S.cfg=n.cfg;S.view=keep}render()},5000);
window.addEventListener('storage',e=>{if(e.key==='gd-kitchen-demo'&&S.view==='tv'){const n=load();if(n){S.adj=n.adj;S.baked=n.baked;S.packed=n.packed;S.ship=n.ship;render()}}});
</script>
