<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen OS Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky ops bar (brand · roles · language · demo) over one working screen per role; kitchen is a TV-scale tile board */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --surface-2:#F6EEE3; --ink:#3B2418; --muted:#7A6253; --line:#EADFD1;
  --accent:#E0457B; --accent-ink:#FFFFFF; --accent-soft:#FCE4EC;
  --ok:#2E9D7A; --ok-soft:#DCF2EA; --warn:#B97A12; --warn-soft:#FBEBCF; --bad:#C0392B; --bad-soft:#F9E0DC;
  --info:#4A6FA5; --info-soft:#E3EBF6; --bar:#3B2418; --bar-ink:#FBF6EF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1410; --surface:#2A1D17; --surface-2:#33241D; --ink:#F7EDE3; --muted:#BFA897; --line:#45342A;
  --accent:#F2689A; --accent-ink:#2A0D18; --accent-soft:#4A2231;
  --ok:#5CC9A4; --ok-soft:#173A2F; --warn:#F0B85A; --warn-soft:#3D2C10; --bad:#F08070; --bad-soft:#44201B;
  --info:#8FB0E0; --info-soft:#1F2A3D; --bar:#140D0A; --bar-ink:#F7EDE3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1410; --surface:#2A1D17; --surface-2:#33241D; --ink:#F7EDE3; --muted:#BFA897; --line:#45342A;
  --accent:#F2689A; --accent-ink:#2A0D18; --accent-soft:#4A2231;
  --ok:#5CC9A4; --ok-soft:#173A2F; --warn:#F0B85A; --warn-soft:#3D2C10; --bad:#F08070; --bad-soft:#44201B;
  --info:#8FB0E0; --info-soft:#1F2A3D; --bar:#140D0A; --bar-ink:#F7EDE3; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12px;opacity:.7}
.roles{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:transparent;color:inherit;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;white-space:nowrap;opacity:.75}
.roles button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);opacity:1}
.langs{display:flex;gap:2px}
.langs button{border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.7}
.langs button[aria-pressed="true"]{opacity:1;border-color:var(--bar-ink)}
.btn-demo{border:0;background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:8px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.btn-demo svg{width:12px;height:12px}

/* demo caption */
.demobar{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.demobar-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-step{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.demo-cap{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.demo-cap strong{font-family:var(--f-display);font-size:20px;font-weight:600}
.demo-cap span{font-size:16px;max-width:80ch}
.demo-prog{flex-basis:100%;height:3px;background:var(--line);border-radius:2px;overflow:hidden;order:9}
.demo-prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.demo-ctl{display:flex;gap:6px}
.demo-ctl button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600}

main{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sample{font-size:12px;color:var(--muted);margin:0 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3.2vw,32px);font-weight:800}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head > div{min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 6px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.pending{background:var(--warn-soft);color:var(--warn)}
.chip.approved,.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.rejected{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.note{padding:12px 14px;border-radius:8px;font-size:14px;font-weight:500}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--info)}

/* PIN */
.pinwrap{max-width:380px;margin:4vh auto 0}
.pinwrap .panel{padding:26px}
.pin-in{width:100%;font-family:var(--f-mono);font-size:34px;letter-spacing:.5em;text-align:center;padding:12px 0 12px .5em;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin:16px 0 12px}
.pinkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pinkeys button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 0;font-family:var(--f-mono);font-size:20px;font-weight:700}
.pinkeys button:active{background:var(--surface-2)}

/* weekly grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
.grid th,.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
.grid thead th{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);text-transform:uppercase;letter-spacing:.05em}
.grid thead th small{display:block;font-family:var(--f-mono);font-weight:500;text-transform:none;letter-spacing:0}
.grid th.fl{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600;white-space:nowrap;min-width:150px}
.grid thead th.fl{background:var(--surface-2)}
.grid tfoot td,.grid tfoot th{border-bottom:0;font-weight:700;background:var(--surface-2)}
.grid td.tot{font-family:var(--f-mono);font-weight:700}
.qty-in{width:56px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;padding:6px 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.qty-in:not([value="0"]):not([value=""]){background:var(--surface);border-color:var(--muted)}
.qty-in:disabled{opacity:.8;background:transparent;border-color:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.actions .spacer{flex:1}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field small{font-size:12px;color:var(--muted)}
.field select,.field input[type=text]{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 6px;font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:46px;padding:10px 0;font-family:var(--f-mono);font-weight:700;font-size:15px}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font-family:var(--f-mono);font-size:18px;font-weight:700;background:var(--surface);padding:8px 0}

.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 4px}
@media (max-width:620px){.tl{grid-template-columns:repeat(3,1fr)}}
.tl div{border-top:4px solid var(--line);padding-top:8px;font-size:13px;font-weight:600;color:var(--muted)}
.tl div.on{border-color:var(--ok);color:var(--ink)}
.tl div.now{border-color:var(--accent);color:var(--ink)}
.tl div small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}

/* manager */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi b small{font-size:15px;color:var(--muted);font-weight:500}
.req{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.req-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.req-top h3{margin-right:auto}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini div{background:var(--surface-2);border-radius:6px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.mini div b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.chg-line{font-size:17px;font-weight:600}
.chg-line .num{color:var(--accent)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th{text-align:center;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center}
.tbl .l{text-align:left}
.tbl .mbar{justify-content:center}
.tbl tr:last-child td{border-bottom:0}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log div:last-child{border-bottom:0}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}

/* kitchen */
.k-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:background .3s,border-color .3s}
.tile .fname{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15}
.tile .big{font-family:var(--f-mono);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em}
.tile .big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.tile .sub{font-size:13px;color:var(--muted)}
.tile.done{background:var(--ok-soft);border-color:var(--ok)}
.tile.done .big{color:var(--ok)}
.tile.more{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.tile .upd{align-self:flex-start;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn);padding:3px 9px;border-radius:999px}
.tile .btn{margin-top:auto}
.swatch{width:26px;height:6px;border-radius:3px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* packing */
.pack{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.pack{grid-template-columns:1fr}}
.storebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px}
.storebtn:last-child{border-bottom:0}
.storebtn[aria-pressed="true"]{background:var(--accent-soft)}
.storebtn .grow{flex:1;min-width:0}
.storebtn .num{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:0}
.check input{width:24px;height:24px;accent-color:var(--ok);flex:none}
.check label{flex:1;min-width:0;font-weight:600;font-size:16px}
.check .num{font-size:18px;font-weight:700}
.check.is-done label{color:var(--muted);text-decoration:line-through}

/* demo highlight */
.hl{animation:hl 2.6s ease-out}
@keyframes hl{0%{box-shadow:0 0 0 0 var(--accent)}15%{box-shadow:0 0 0 4px var(--accent)}60%{box-shadow:0 0 0 8px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.story{background:var(--bar);color:var(--bar-ink);border-radius:18px;min-height:min(68vh,620px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:clamp(28px,6vw,72px)}
.story .eyebrow{color:var(--accent);font-size:13px}
.story h1{font-size:clamp(34px,6vw,64px);line-height:1.02;max-width:16ch}
.story p{font-size:clamp(17px,2vw,22px);max-width:52ch;margin:0;opacity:.85}
.story ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:60ch}
.story li{font-size:clamp(16px,2vw,21px);font-weight:600;display:flex;gap:14px;align-items:baseline;opacity:0;animation:up .7s ease-out forwards}
.story li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateY(1px)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.story .flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){.story li{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.sample .nowclk{background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--ink);font-size:12px}
.sample .scen{margin-left:auto;display:flex;gap:6px}
.sample .scen button{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ab{font-family:var(--f-mono);font-weight:700;font-size:13px;min-width:52px;text-align:center;padding:4px 6px;border-radius:6px;flex:none}
.ab.up{background:var(--ok-soft);color:var(--ok)}.ab.down{background:var(--info-soft);color:var(--info)}.ab.late{background:var(--bad-soft);color:var(--bad)}.ab.req{background:var(--warn-soft);color:var(--warn)}
.d-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.d-strip > div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.d-strip b{font-size:24px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dcard{padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.dcard.delayed{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.dcard.delivered{background:var(--surface-2)}
.dcard .btn{align-self:flex-start}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.mbar{display:flex;align-items:center;gap:8px}.mbar i{height:6px;border-radius:3px;background:var(--ok);display:block;flex:none}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:420px;width:100%}
.heat td{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:7px 2px;border-radius:5px}
.heat th{font-size:11px;color:var(--muted);font-weight:700;padding:4px 2px;white-space:nowrap}
.heat th.rh{text-align:left;font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>Kitchen<i>OS</i></b><span id="brand-sub"></span></div>
    <nav class="roles" id="roles" aria-label="Screens"></nav>
    <div class="langs" id="langs"></div>

const DAY_PL={en:["Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays","Sundays"],pt:["segundas","terças","quartas","quintas","sextas","sábados","domingos"],es:["lunes","martes","miércoles","jueves","viernes","sábados","domingos"]};
const MON_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MON_ES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const WEEK_START=new Date(2026,9,26); // Monday Oct 26, 2026
const TODAY=0;

let lang="en";
try{const s=localStorage.getItem("kos-lang");if(s&&L[s])lang=s;}catch(e){}
function t(k,...a){let s=(L[lang][k]!=null?L[lang][k]:(L.en[k]!=null?L.en[k]:k));a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s;}
function dateOf(d){const x=new Date(WEEK_START);x.setDate(x.getDate()+d);return x;}
function fmtDate(d){const x=dateOf(d);const day=x.getDate(),m=x.getMonth();
  if(lang==="pt")return String(day).padStart(2,"0")+"/"+String(m+1).padStart(2,"0");
  if(lang==="es")return day+" "+MON_ES[m];return MON_EN[m]+" "+day;}
function dayShort(d){return DAYS[lang][d];}
function dayLong(d){return DAYS_L[lang][d]+", "+fmtDate(d);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------------- data ---------------- */
const FLAVORS=["Glazed","Chocolate Frosted","Boston Cream","Strawberry Sprinkle","Maple Bacon","Cinnamon Sugar","Jelly Filled","Old Fashioned"];
const FCOL=["#E8B04B","#6B3E26","#F2D16B","#E86A92","#B5651D","#C98B4E","#B3264A","#D9A066"];
const STORES=[null,"Downtown","Riverside","Mill St","Harbor","Oak Park","Union Sq","Westgate","Maple Ave","Station","Northfield","Lakeside","Elm Center"];
const pad2=n=>String(n).padStart(2,"0");
const storeLabel=s=>t("storeN",pad2(s))+" · "+STORES[s];
const storeShort=s=>t("storeN",pad2(s));
const pinOf=s=>pad2(s)+pad2(s);

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t2=Math.imul(a^a>>>15,1|a);t2=t2+Math.imul(t2^t2>>>7,61|t2)^t2;return((t2^t2>>>14)>>>0)/4294967296;}}
function makeTemplate(seed){const r=mulberry(seed),w=[];for(let d=0;d<7;d++){const o={};const boost=d>=4?1.5:1;
  FLAVORS.forEach((f,i)=>{const base=[4,3,3,2,2,2,2,2][i];let q=Math.round((base+r()*3)*boost)*6;if(r()<.12)q=0;o[f]=q;});w.push(o);}return w;}
const TEMPLATES={};for(let s=1;s<=12;s++)TEMPLATES[s]=makeTemplate(s*97+13);

/* phase 2 reference data (sample) */
const ROUTE=[0,18,25,12,35,22,15,40,28,10,45,30,20];          // minutes kitchen → store
const DUE=7*60+30;                                             // deliveries due by 07:30 (stores open 08:00)
const CLOSE_DUE=21*60;                                         // closing due by 9:00 pm
const PRICE0=[2.49,2.99,3.29,2.99,3.79,2.49,3.19,2.29], COST0=[0.48,0.71,0.86,0.69,1.24,0.52,0.81,0.44];
const AFF={};for(let s=1;s<=12;s++){const up=(s*3)%8;let dn=(s*5+2)%8;if(dn===up)dn=(up+3)%8;AFF[s]={up,dn};}
const wdOf=d=>((d%7)+7)%7;
const fmtClock=m=>pad2(Math.floor(m/60))+":"+pad2(Math.round(m)%60);
const HIST=[],CLOSED_AT={};
(function(){const r=mulberry(2026);for(let d=-28;d<=-1;d++){const wd=wdOf(d);for(let s=1;s<=12;s++){
  CLOSED_AT[s+"|"+d]=20*60+25+Math.floor(r()*40)+(r()<.12?55:0);
  FLAVORS.forEach((f,fi)=>{const base=TEMPLATES[s][wd][f];if(!base)return;
    const sent=Math.max(6,Math.round(base*(0.9+r()*0.2)));
    const ratio=(0.8+r()*0.3)*(fi===AFF[s].up?1.32:fi===AFF[s].dn?0.68:1);
    const demand=Math.round(sent*ratio),sold=Math.min(sent,demand);
    const so=demand>=sent?Math.round(Math.min(19*60,Math.max(10*60+30,18*60-(ratio-1)*1500-r()*90))):null;
    HIST.push({s,d,f,fi,sent,sold,left:sent-sold,so});});}}})();

let S;let idSeq=1;
function freshState(){
  idSeq=1;
  S={role:S?S.role:"store",session:null,storeTab:"weekly",draft:null,orders:[],released:{},doneQty:{},updates:{},packed:{},shipped:{},received:{},
     log:[],mgrTab:"overview",packStore:null,clock:5*60+40,closeDraft:{},closed:{},price:PRICE0.slice(),cost:COST0.slice(),mView:"product",mPeriod:28,mSel:null,chg:{when:"today",day:1,flavor:FLAVORS[0],qty:1,note:""},pinVal:"",pinErr:false};
  for(let s=1;s<=12;s++){if(s===3)continue;
    S.orders.push({id:idSeq++,store:s,type:"weekly",status:s===11?"pending":"approved",items:clone(TEMPLATES[s]),ts:"Sun 18:"+pad2(s*4)});}
}
function clone(o){return JSON.parse(JSON.stringify(o));}
function tick(min){S.clock+=(min==null?(3+Math.floor(Math.random()*5)):min);return fmtClock(S.clock);}
function realNow(){const n=new Date();return n.getHours()*60+n.getMinutes();}
/* a realistic mid-morning: kitchen almost done, 7 stores delivered, 2 on the road, 1 urgent change */
function seedLive(){freshState();
  S.orders.push({id:idSeq++,store:3,type:"weekly",status:"approved",items:clone(TEMPLATES[3]),ts:"Sun 19:02"});
  S.orders.find(o=>o.store===11).status="approved";
  const lg=[];const L2=(m,key,args)=>lg.push({time:fmtClock(m),key,args});
  S.released[0]=true;L2(4*60+20,"lg_release",[{d:0}]);
  FLAVORS.forEach((f,i)=>{const q=dayTotal(0,f);if(!q)return;S.doneQty["0|"+f]=q;L2(5*60+i*6,"lg_done",[f,q]);});
  S.orders.push({id:idSeq++,store:12,type:"change",status:"approved",day:0,flavor:"Glazed",delta:12,note:"Office order 10 am",ts:"06:48"});
  S.updates["0|Glazed"]={delta:12,store:12};L2(6*60+48,"lg_change",[{s:12},"+12","Glazed",{d:0}]);L2(6*60+51,"lg_appr",[{sk:{s:12,k:"typeChange"}}]);
  S.orders.push({id:idSeq++,store:9,type:"change",status:"pending",day:1,flavor:"Jelly Filled",delta:-6,note:"",ts:"07:09"});
  L2(7*60+9,"lg_change",[{s:9},"-6","Jelly Filled",{d:1}]);
  const jit=[0,2,-3,4,1,-2,5,3];
  for(let st=1;st<=9;st++){storeFlavors(st,0).forEach(f=>S.packed["0|"+st+"|"+f]=true);const dep=st===8?6*60+48:5*60+45+(st-1)*7;S.shipped["0|"+st]=dep;L2(dep,"lg_disp",[{s:st}]);
    if(st<=7){const at=dep+ROUTE[st]+jit[st];S.received["0|"+st]=at;L2(at,"lg_recv",[{s:st}]);}}
  storeFlavors(10,0).slice(0,3).forEach(f=>S.packed["0|10|"+f]=true);
  lg.sort((a,b)=>b.time.localeCompare(a.time));S.log=lg;S.clock=7*60+15;S.mgrTab="overview";}
function addLog(key,args){S.log.unshift({time:tick(),key,args});}
function argText(a){if(a&&typeof a==="object"){if(a.s)return storeShort(a.s);if(a.k)return t(a.k);if(a.d!=null)return dayShort(a.d);if(a.sk)return storeShort(a.sk.s)+" · "+t(a.sk.k);}return String(a);}

/* derived */
function approved(s){return S.orders.filter(o=>o.store===s&&o.status==="approved");}
function weeklyOf(s){const w=S.orders.filter(o=>o.store===s&&o.type==="weekly");return w[w.length-1]||null;}
function storeQty(s,d,f){let q=0;approved(s).forEach(o=>{if(o.type==="weekly")q+=(o.items[d][f]||0);else if(o.day===d&&o.flavor===f)q+=o.delta;});return Math.max(0,q);}
function dayTotal(d,f){let q=0;for(let s=1;s<=12;s++)q+=storeQty(s,d,f);return q;}
function storesFor(d,f){let n=0;for(let s=1;s<=12;s++)if(storeQty(s,d,f)>0)n++;return n;}
function fStatus(d,f){const tot=dayTotal(d,f),dn=S.doneQty[d+"|"+f];if(dn==null)return{st:"todo",tot};if(tot>dn)return{st:"more",tot,need:tot-dn};return{st:"done",tot};}
function storeFlavors(s,d){return FLAVORS.filter(f=>storeQty(s,d,f)>0);}
function packedCount(s,d){return storeFlavors(s,d).filter(f=>S.packed[d+"|"+s+"|"+f]).length;}
function isPacked(s,d){const fl=storeFlavors(s,d);return fl.length>0&&packedCount(s,d)===fl.length;}
function storeStage(s,d){ // 0 none .. 6 received
  const w=weeklyOf(s);if(!w)return 0;if(S.received[d+"|"+s])return 6;if(S.shipped[d+"|"+s])return 5;if(isPacked(s,d))return 4;
  if(w.status==="approved"&&S.released[d])return 3;if(w.status==="approved")return 2;return 1;}

/* ---------------- actions ---------------- */
const A={
  role(r){S.role=r;render();},
  lang(l){lang=l;try{localStorage.setItem("kos-lang",l)}catch(e){}renderChrome();render();},
  pinKey(k){if(k==="del")S.pinVal=S.pinVal.slice(0,-1);else if(S.pinVal.length<4)S.pinVal+=k;S.pinErr=false;render();},
  login(){const s=[...Array(13).keys()].slice(1).find(n=>pinOf(n)===S.pinVal);if(!s){S.pinErr=true;render();return;}
    S.session=s;S.pinVal="";S.pinErr=false;S.storeTab="weekly";S.draft=null;render();},
  logout(){S.session=null;S.draft=null;render();},
  storeTab(x){S.storeTab=x;render();},
  copyLast(){S.draft=clone(TEMPLATES[S.session]);render();},
  clearDraft(){S.draft=emptyWeek();render();},
  submitWeekly(){const tot=sumWeek(S.draft);if(!tot){toast(t("emptyOrder"));return false;}
    const prev=weeklyOf(S.session);if(prev&&prev.status==="rejected")S.orders=S.orders.filter(o=>o!==prev);
    S.orders.push({id:idSeq++,store:S.session,type:"weekly",status:"pending",items:clone(S.draft),ts:tick(0)});
    addLog("lg_weekly",[{s:S.session}]);S.draft=null;render();return true;},
  chgWhen(w){S.chg.when=w;render();},
  chgStep(n){S.chg.qty+=n;render();},
  submitChange(){readChg();const c=S.chg;if(!c.qty){toast(t("chgZero"));return;}
    const day=c.when==="today"?TODAY:c.when==="tomorrow"?TODAY+1:c.day;
    S.orders.push({id:idSeq++,store:S.session,type:"change",status:"pending",day,flavor:c.flavor,delta:c.qty,note:c.note,ts:tick(0)});
    addLog("lg_change",[{s:S.session},(c.qty>0?"+":"")+c.qty,c.flavor,{d:day}]);S.chg.note="";toast(t("chgSent"));render();},
  approve(id){const o=S.orders.find(x=>x.id===+id);if(!o)return;o.status="approved";
    addLog("lg_appr",[{sk:{s:o.store,k:o.type==="weekly"?"typeWeekly":"typeChange"}}]);
    if(o.type==="change"&&S.released[o.day]){const k=o.day+"|"+o.flavor;S.updates[k]={delta:o.delta,store:o.store};}
    render();},
  reject(id){const o=S.orders.find(x=>x.id===+id);if(!o)return;o.status="rejected";addLog("lg_rej",[{sk:{s:o.store,k:o.type==="weekly"?"typeWeekly":"typeChange"}}]);render();},
  mgrTab(x){S.mgrTab=x;render();},
  release(d){S.released[+d]=true;addLog("lg_release",[{d:+d}]);render();},
  markDone(f){const d=TODAY,st=fStatus(d,f);S.doneQty[d+"|"+f]=st.tot;delete S.updates[d+"|"+f];addLog("lg_done",[f,st.tot]);render();},
  packStore(s){S.packStore=+s;render();},
  packTick(f){const k=TODAY+"|"+S.packStore+"|"+f;S.packed[k]=!S.packed[k];render();},
  dispatch(v){const st=v?+v:S.packStore;S.clock+=2;S.shipped[TODAY+"|"+st]=S.clock;S.log.unshift({time:fmtClock(S.clock),key:"lg_disp",args:[{s:st}]});render();},
  receive(v){const st=v?+v:S.session,k=TODAY+"|"+st;const dep=S.shipped[k];S.clock=Math.max(S.clock+3,dep!=null?dep+ROUTE[st]:S.clock);S.received[k]=S.clock;
    S.log.unshift({time:fmtClock(S.clock),key:"lg_recv",args:[{s:st}]});render();},
  scenario(v){if(demo.on){demo.on=false;demo.playing=false;demo.story=null;demo.tok++;clearTimeout(demo.timer);}const r=S.role;if(v==="live")seedLive();else freshState();S.role=r;render();},
  soldOut(f){const dr=closeDraftOf(S.session);const row=dr.rows[f];row.so=row.so==null?realNow():null;if(row.so!=null)row.left="0";render();},
  submitClose(at0){const st=S.session,dr=closeDraftOf(st);const by=(document.getElementById("cl-by")||{}).value||dr.by;dr.by=by;
    if(!by.trim()){toast(t("clErrName"));return;}
    const rows={};for(const f of storeFlavors(st,TODAY)){const sent=storeQty(st,TODAY,f),left=parseInt(dr.rows[f].left,10)||0;
      if(left>sent||left<0){toast(t("clErrLeft",sent)+" · "+f);return;}rows[f]={sent,left,so:dr.rows[f].so};}
    const at=(at0!=null&&!isNaN(+at0))?+at0:realNow();S.closed[st]={by:by.trim(),at,rows};S.log.unshift({time:fmtClock(at),key:"lg_close",args:[{s:st}]});render();},
  mView(v){S.mView=v;render();},mPeriod(v){S.mPeriod=+v;render();},mSel(v){S.mSel=+v;render();}
};
function emptyWeek(){return [...Array(7)].map(()=>{const o={};FLAVORS.forEach(f=>o[f]=0);return o;});}
function sumWeek(w){let n=0;w.forEach(o=>FLAVORS.forEach(f=>n+=(+o[f]||0)));return n;}
function readChg(){const g=id=>document.getElementById(id);if(g("chg-flavor"))S.chg.flavor=g("chg-flavor").value;if(g("chg-day"))S.chg.day=+g("chg-day").value;
  if(g("chg-qty"))S.chg.qty=parseInt(g("chg-qty").value,10)||0;if(g("chg-note"))S.chg.note=g("chg-note").value;}

/* ---------------- views ---------------- */
const app=document.getElementById("app");
function chip(cls,txt){return `<span class="chip ${cls}">${esc(txt)}</span>`;}

function vStore(){
  if(!S.session){const keys=["1","2","3","4","5","6","7","8","9","del","0","ok"];
    return `<div class="pinwrap"><div class="panel">
      <div class="eyebrow">Kitchen OS</div><h1>${t("pinTitle")}</h1><p class="muted">${t("pinHelp")}</p>
      <input class="pin-in" id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN" value="${esc(S.pinVal)}">
      <div class="pinkeys">${keys.map(k=>k==="ok"?`<button type="button" data-a="login" id="pin-ok" style="background:var(--ink);color:var(--bg);font-family:var(--f-body);font-size:15px">${t("enter")}</button>`
        :k==="del"?`<button type="button" data-a="pinKey" data-v="del" aria-label="Delete">⌫</button>`:`<button type="button" data-a="pinKey" data-v="${k}">${k}</button>`).join("")}</div>
      ${S.pinErr?`<div class="note bad" style="margin-bottom:10px">${t("pinWrong")}</div>`:""}
      <p class="muted" style="font-size:13px;margin:0">${t("pinHint")}</p></div></div>`;}
  const s=S.session,w=weeklyOf(s),pend=S.orders.filter(o=>o.store===s&&o.type==="change"&&o.status==="pending").length;
  return `<div class="head"><div><div class="eyebrow">${t("r_store")}</div><h1>${esc(storeLabel(s))}</h1></div>
    <button class="btn sm" type="button" data-a="logout">${t("logout")}</button></div>
    <div class="tabs">${[["weekly","tabWeekly"],["change","tabChange"],["today","tabToday"],["close","tabClose"]].map(([k,l])=>`<button type="button" data-a="storeTab" data-v="${k}" aria-pressed="${S.storeTab===k}">${t(l)}${k==="change"&&pend?`<span class="count">${pend}</span>`:""}</button>`).join("")}</div>
    ${S.storeTab==="weekly"?vWeekly(s,w):S.storeTab==="change"?vChange(s):S.storeTab==="close"?vClosing(s):vStoreToday(s)}`;
}
function vWeekly(s,w){
  const locked=w&&w.status!=="rejected";
  if(!locked&&!S.draft)S.draft=emptyWeek();
  const data=locked?w.items:S.draft;
  const head=`<tr><th class="fl">${t("flavor")}</th>${[0,1,2,3,4,5,6].map(d=>`<th>${dayShort(d)}<small>${fmtDate(d)}</small></th>`).join("")}<th>${t("total")}</th></tr>`;
  const rows=FLAVORS.map((f,i)=>`<tr><th class="fl"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${FCOL[i]};margin-right:8px"></span>${f}</th>
    ${[0,1,2,3,4,5,6].map(d=>`<td><input class="qty-in" type="number" min="0" step="1" inputmode="numeric" id="q-${d}-${i}" data-d="${d}" data-f="${i}" value="${data[d][f]||0}" ${locked?"disabled":""} aria-label="${f} ${dayShort(d)}"></td>`).join("")}
    <td class="tot" id="rt-${i}">0</td></tr>`).join("");
  const foot=`<tr><th class="fl">${t("total")}</th>${[0,1,2,3,4,5,6].map(d=>`<td class="tot" id="ct-${d}">0</td>`).join("")}<td class="tot" id="gt">0</td></tr>`;
  let status="";
  if(w){status=w.status==="pending"?`<div class="note warn">${t("sentWaiting")}</div>`:w.status==="approved"?`<div class="note ok">${t("weekApproved")}</div>`:`<div class="note bad">${t("weekRejected")}</div>`;}
  return `<div class="stack">
    <div class="head" style="margin:0"><div><h2>${t("weekOf",fmtDate(0))}</h2></div>${w?chip(w.status,t("st_"+w.status)):""}</div>
    ${status}
    <div class="gridwrap" id="weekgrid"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>
    ${locked?"":`<div class="actions"><button class="btn" type="button" data-a="copyLast" id="btn-copy">${t("copyLast")}</button>
      <button class="btn" type="button" data-a="clearDraft">${t("clear")}</button><span class="spacer"></span>
      <button class="btn accent" type="button" data-a="submitWeekly" id="btn-submit">${t("submitWeek")}</button></div>`}
  </div>`;
}
function recalcGrid(){const data=(()=>{const w=weeklyOf(S.session);return (w&&w.status!=="rejected")?w.items:S.draft;})();if(!data||!document.getElementById("gt"))return;
  let g=0;FLAVORS.forEach((f,i)=>{let r=0;for(let d=0;d<7;d++)r+=(+data[d][f]||0);document.getElementById("rt-"+i).textContent=r;});
  for(let d=0;d<7;d++){let c=0;FLAVORS.forEach(f=>c+=(+data[d][f]||0));document.getElementById("ct-"+d).textContent=c;g+=c;}
  document.getElementById("gt").textContent=g;}
function vChange(s){const c=S.chg;const mine=S.orders.filter(o=>o.store===s&&o.type==="change").slice().reverse();
  return `<div class="two">
   <div class="panel pad stack" id="chg-panel"><div><h2>${t("chgTitle")}</h2><p class="muted" style="margin:4px 0 0">${t("chgHelp")}</p></div>

   </div></div>`;}
function vStoreToday(s){const d=TODAY,stage=storeStage(s,d);
  if(!stage)return `<div class="panel empty"><h2>${t("tabToday")}</h2><p>${t("noOrderYet")}</p></div>`;
  const steps=["tl_sent","tl_appr","tl_prod","tl_packed","tl_ship","tl_recv"];

   <div class="panel pad" style="overflow-x:auto"><h2 style="margin-bottom:8px">${t("stores")}</h2>

function vPacking(){const d=TODAY;const act=[];for(let s=1;s<=12;s++)if(storeFlavors(s,d).length&&S.released[d])act.push(s);

    ${fl.map(f=>{const i=FLAVORS.indexOf(f),k=d+"|"+s+"|"+f,ready=S.doneQty[d+"|"+f]!=null,on=!!S.packed[k];

/* ---------------- phase 2: control ---------------- */
const money=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const pct=n=>Math.round(n*100)+"%";
const sgn=n=>(n>0?"+":n<0?"−":"")+Math.abs(n);
function agg(rs){const a={sent:0,sold:0,left:0,rev:0,cost:0,waste:0};rs.forEach(r=>{const p=S.price[r.fi],c=S.cost[r.fi];a.sent+=r.sent;a.sold+=r.sold;a.left+=r.left;a.rev+=r.sold*p;a.cost+=r.sent*c;a.waste+=r.left*c;});
  a.margin=a.rev-a.cost;a.mp=a.rev?a.margin/a.rev:0;a.st=a.sent?a.sold/a.sent:0;return a;}
function recsIn(p){const out=HIST.filter(r=>r.d>=-p);
  Object.entries(S.closed).forEach(([st,c])=>Object.entries(c.rows).forEach(([f,x])=>out.push({s:+st,d:0,f,fi:FLAVORS.indexOf(f),sent:x.sent,sold:x.sent-x.left,left:x.left,so:x.so})));return out;}
function insights(){const wd=wdOf(TODAY),by={};HIST.filter(r=>wdOf(r.d)===wd).forEach(r=>{(by[r.s+"|"+r.f]=by[r.s+"|"+r.f]||[]).push(r);});
  const raise=[],reduce=[];
  Object.values(by).forEach(rs=>{const n=rs.length,early=rs.filter(r=>r.so!=null&&r.so<14*60).length,sent=rs.reduce((a,r)=>a+r.sent,0),left=rs.reduce((a,r)=>a+r.left,0);
    if(early>=3)raise.push({s:rs[0].s,f:rs[0].f,n:early,add:Math.max(6,Math.round(sent/n*0.2/6)*6)});
    if(sent&&left/sent>0.25)reduce.push({s:rs[0].s,f:rs[0].f,p:Math.round(left/sent*100),cut:Math.max(6,Math.round(left/n/6)*6)});});
  raise.sort((a,b)=>b.n-a.n||b.add-a.add);reduce.sort((a,b)=>b.p-a.p);return{raise:raise.slice(0,3),reduce:reduce.slice(0,3)};}

function dStatus(s){const d=TODAY,k=d+"|"+s;const fl=storeFlavors(s,d);
  if(!fl.length||!S.released[d])return{st:"none"};
  if(S.received[k]!=null){const at=S.received[k];return{st:"delivered",at,late:at>DUE};}
  if(S.shipped[k]!=null){const dep=S.shipped[k],eta=dep+ROUTE[s];return{st:S.clock>eta?"delayed":"onway",dep,eta};}
  if(isPacked(s,d))return{st:"ready"};
  if(packedCount(s,d)===0&&fl.some(f=>S.doneQty[d+"|"+f]==null))return{st:"waitk"};
  return{st:"packing"};}
const D_LBL={none:"dNotReleased",waitk:"dWaitK",packing:"dPacking",ready:"dReady",onway:"dOnWay",delayed:"dDelayed",delivered:"dDelivered"};
const D_CLS={none:"",waitk:"pending",packing:"info",ready:"approved",onway:"accent",delayed:"rejected",delivered:"done"};

function vOverview(){const d=TODAY;
  let planned=0,produced=0;FLAVORS.forEach(f=>{const q=dayTotal(d,f);planned+=q;const dn=S.doneQty[d+"|"+f];if(dn!=null)produced+=Math.min(dn,q);});

  const dlv=act.filter(s=>S.received[d+"|"+s]!=null),onway=act.filter(s=>S.shipped[d+"|"+s]!=null&&S.received[d+"|"+s]==null);
  const onTime=dlv.filter(s=>S.received[d+"|"+s]<=DUE).length;
  const chg=S.orders.filter(o=>o.type==="change"&&o.day===d),net=chg.filter(o=>o.status==="approved").reduce((a,o)=>a+o.delta,0);
  const pend=S.orders.filter(o=>o.status==="pending").length;
  const y=HIST.filter(r=>r.d===-1),ya=agg(y),so=y.filter(r=>r.so!=null),earliest=so.length?Math.min(...so.map(r=>r.so)):null;

  const ins=insights(),al=[];
  act.forEach(s=>{const ds=dStatus(s);if(ds.st==="delayed")al.push(`<div class="row"><span class="ab late">ETA</span><div class="grow">${esc(t("lateTip",storeShort(s),fmtClock(ds.eta)))}</div></div>`);});
  if(pend)al.push(`<div class="row"><span class="ab req">${pend}</span><div class="grow">${esc(t("reqTip",pend))}</div><button class="btn sm" type="button" data-a="mgrTab" data-v="inbox">${t("m_inbox")}</button></div>`);

  ins.reduce.forEach(x=>al.push(`<div class="row"><span class="ab down">−${x.cut}</span><div class="grow">${esc(t("reduceTip",storeShort(x.s),x.f,x.p,DAY_PL[lang][wdOf(TODAY)],x.cut))}</div></div>`));
  const yrow=(l,v)=>`<div class="row"><div class="grow">${l}</div><b class="num">${v}</b></div>`;
  return `<div class="head"><div><div class="eyebrow">${t("live",fmtClock(S.clock))}</div><h2>${dayLong(d)}</h2></div></div>
  <div class="kpis" id="ov-kpis">
    ${kpi(t("oProduced"),`${produced}<small>/${planned}</small>`,t("oOf",planned),planned?produced/planned*100:0)}
    ${kpi(t("oDelivered"),`${dlv.length}<small>/${act.length}</small>`,t("oOnWay",onway.length),act.length?dlv.length/act.length*100:0)}
    ${kpi(t("oOnTime"),dlv.length?pct(onTime/dlv.length):"—",t("oOnTimeSub",fmtClock(DUE)),null)}

      ${FLAVORS.filter(f=>dayTotal(d,f)>0).map(f=>{const st=fStatus(d,f),dn=Math.min(S.doneQty[d+"|"+f]||0,st.tot),p=dn/st.tot*100;
        return `<div class="row" style="flex-wrap:wrap;gap:6px 12px"><div class="grow" style="font-weight:600">${esc(f)}</div><span class="num">${dn}/${st.tot}</span><div class="bar" style="flex-basis:100%"><i style="width:${p}%;${st.st==="more"?"background:var(--warn)":""}"></i></div></div>`;}).join("")}

      ${yrow(t("ySoldOut"),`${so.length}${earliest!=null?" · "+t("yEarliest",fmtClock(earliest)):""}`)}
      ${yrow(t("yClosings"),"12/12")}${yrow(t("yMargin"),`${money(ya.margin)} · ${pct(ya.mp)}`)}
    </div></div>
  </div>
  <div class="panel pad" id="ov-att" style="margin-top:18px"><h3 style="margin-bottom:4px">${t("attention")}</h3><div class="list">${al.join("")||`<p class="muted">${t("noAlerts")}</p>`}</div></div>`;}

function closeDraftOf(s){if(!S.closeDraft[s]){const rows={};FLAVORS.forEach(f=>rows[f]={left:"",so:null});S.closeDraft[s]={by:"",rows};}return S.closeDraft[s];}

    ${hist.map(h=>`<tr><td class="l">${dayShort(wdOf(h.dd))} <span class="muted num">${fmtDate(h.dd)}</span></td><td class="num">${pct(h.a.st)}</td><td class="num">${h.so}</td><td>${chip(h.at<=CLOSE_DUE?"done":"pending",fmtClock(h.at))}</td></tr>`).join("")}
    </tbody></table></div></div></div>`;}

function vDeliveries(){const ids=[...Array(12)].map((_,i)=>i+1),ord={delayed:0,onway:1,ready:2,packing:3,waitk:4,delivered:5,none:6};
  const list=ids.map(s=>Object.assign({s},dStatus(s))).sort((a,b)=>ord[a.st]-ord[b.st]||a.s-b.s);
  const cnt={};list.forEach(x=>cnt[x.st]=(cnt[x.st]||0)+1);
  const strip=["waitk","packing","ready","onway","delayed","delivered"].map(k=>`<div class="panel"><span class="chip ${D_CLS[k]}">${t(D_LBL[k])}</span><b class="num">${cnt[k]||0}</b></div>`).join("");
  const cards=list.map(x=>{const s=x.s,n=storeFlavors(s,TODAY).length,p=packedCount(s,TODAY);let body="";
    if(x.st==="waitk"||x.st==="packing")body=`<div class="bar"><i style="width:${n?p/n*100:0}%"></i></div><div class="muted num" style="font-size:13px">${t("packProg",p,n)}</div>`;
    else if(x.st==="ready")body=`<button class="btn ok sm" type="button" data-a="dispatch" data-v="${s}">${t("markDeparted")}</button>`;
    else if(x.st==="onway"||x.st==="delayed"){const el=Math.min(100,Math.max(0,(S.clock-x.dep)/ROUTE[s]*100));
      body=`<div class="bar"><i style="width:${el}%;background:${x.st==="delayed"?"var(--bad)":"var(--accent)"}"></i></div><div class="num" style="font-size:13px">${t("dDepart",fmtClock(x.dep))} · ${t("dEta",fmtClock(x.eta))}</div>
        <button class="btn sm" type="button" data-a="receive" data-v="${s}">${t("markDelivered")}</button>`;}
    else if(x.st==="delivered")body=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="num" style="font-size:13px">${t("dAt",fmtClock(x.at))}</span>${chip(x.late?"rejected":"done",t(x.late?"dLate":"dOnTime"))}</div>`;
    return `<div class="panel dcard ${x.st}" id="dc-${s}"><div style="display:flex;gap:8px;align-items:center"><h3 style="flex:1;min-width:0">${esc(storeShort(s))} <span class="muted" style="font-weight:500;font-family:var(--f-body);font-size:14px">${STORES[s]}</span></h3>${chip(D_CLS[x.st],t(D_LBL[x.st]))}</div>
      ${body}<div class="muted" style="font-size:12px">${t("dRoute",ROUTE[s])}</div></div>`;}).join("");
  return `<div class="head"><div><div class="eyebrow">${t("live",fmtClock(S.clock))}</div><h1>${t("dTitle",dayLong(TODAY))}</h1></div></div>
    <div class="d-strip" id="d-strip">${strip}</div><div class="d-grid">${cards}</div>`;}

function vMargin(){const rs=recsIn(S.mPeriod),tot=agg(rs);
  const groups=S.mView==="product"?FLAVORS.map((f,i)=>({key:i,name:f,sw:FCOL[i],a:agg(rs.filter(r=>r.fi===i))}))
    :[...Array(12)].map((_,i)=>({key:i+1,name:storeLabel(i+1),a:agg(rs.filter(r=>r.s===i+1))}));
  groups.sort((x,y)=>y.a.margin-x.a.margin);const maxM=Math.max(...groups.map(g=>g.a.margin),1);
  const kp=(l,v)=>`<div class="panel kpi"><span class="eyebrow">${l}</span><b>${v}</b></div>`;
  const isStore=S.mView==="store",sel=isStore?(S.mSel||groups[0].key):null;
  const table=`<div class="panel pad" id="m-table" style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th class="l">${t("mName")}</th><th>${t("mSold")}</th><th>${t("mSell")}</th><th>${t("mRevenue")}</th><th>${t("mMargin")}</th><th>${t("mMarginPct")}</th><th>${t("mWaste")}</th></tr></thead><tbody>
    ${groups.map((g,i)=>`<tr class="${isStore?"click":""} ${isStore&&g.key===sel?"sel":""}" ${isStore?`data-a="mSel" data-v="${g.key}" tabindex="0"`:""}><td class="num">${i+1}</td>
      <td class="l" style="white-space:nowrap;font-weight:600">${g.sw?`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${g.sw};margin-right:8px"></span>`:""}${esc(g.name)}</td>
      <td class="num">${g.a.sold.toLocaleString("en-US")}</td><td class="num">${pct(g.a.st)}</td><td class="num">${money(g.a.rev)}</td>
      <td><div class="mbar"><i style="width:${Math.max(4,g.a.margin/maxM*90)}px"></i><span class="num">${money(g.a.margin)}</span></div></td><td class="num">${pct(g.a.mp)}</td><td class="num">${money(g.a.waste)}</td></tr>`).join("")}
    </tbody></table>${isStore?`<p class="muted" style="font-size:13px;margin:10px 0 0">${t("pickRow")}</p>`:""}</div>`;
  let extra="";
  if(isStore){const mine=rs.filter(r=>r.s===sel),ms=mine.reduce((a,r)=>a+r.sold,0)||1,ns=rs.reduce((a,r)=>a+r.sold,0)||1;
    const mix=FLAVORS.map((f,i)=>{const a=mine.filter(r=>r.fi===i).reduce((x,r)=>x+r.sold,0)/ms,b=rs.filter(r=>r.fi===i).reduce((x,r)=>x+r.sold,0)/ns;return{f,i,a,b,idx:b?a/b:0};}).sort((x,y)=>y.idx-x.idx);
    const top=mix[0];
    const max=Math.max(...[...Array(12)].map((_,i)=>Math.max(...FLAVORS.map((f,fi)=>rs.filter(r=>r.s===i+1&&r.fi===fi).reduce((x,r)=>x+r.sold,0)))),1);
    extra=`<div class="two" style="margin-top:18px"><div class="panel pad" id="m-mix"><h3>${esc(t("mixTitle",storeLabel(sel)))}</h3><p class="muted" style="margin:4px 0 10px;font-size:13px">${t("mixHelp")}</p>
      <div class="note ok" style="margin-bottom:10px">${esc(t("mixTop",top.idx.toFixed(1),top.f))}</div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:0"><thead><tr><th class="l">${t("flavor")}</th><th>${t("storeShare")}</th><th>${t("netShare")}</th><th>${t("index")}</th></tr></thead><tbody>
      ${mix.map(m=>`<tr><td class="l" style="white-space:nowrap">${m.f}</td><td class="num">${pct(m.a)}</td><td class="num muted">${pct(m.b)}</td><td>${chip(m.idx>=1.2?"done":m.idx<=0.8?"info":"",m.idx.toFixed(2)+"×")}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel pad" id="m-heat"><h3 style="margin-bottom:10px">${t("heatTitle")}</h3><div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${FLAVORS.map((f,i)=>`<th title="${f}"><span style="display:block;width:22px;height:5px;border-radius:2px;background:${FCOL[i]};margin:0 auto 3px"></span>${f.split(" ").map(w=>w[0]).join("")}</th>`).join("")}</tr></thead><tbody>
      ${[...Array(12)].map((_,i)=>`<tr><th class="rh">${pad2(i+1)}</th>${FLAVORS.map((f,fi)=>{const v=rs.filter(r=>r.s===i+1&&r.fi===fi).reduce((x,r)=>x+r.sold,0),p=Math.round(8+v/max*80);
        return `<td style="background:color-mix(in srgb,var(--accent) ${p}%,var(--surface));color:${p>55?"var(--accent-ink)":"var(--ink)"};${i+1===sel?"outline:2px solid var(--ink)":""}" title="${esc(storeShort(i+1))} · ${f}: ${v}">${v}</td>`;}).join("")}</tr>`).join("")}
      </tbody></table></div></div></div>`;}
  const prices=`<div class="panel pad" id="m-prices" style="margin-top:18px"><h3>${t("priceTitle")}</h3><p class="muted" style="margin:4px 0 10px;font-size:13px">${t("priceHelp")}</p>
    <div style="overflow-x:auto"><table class="tbl" style="min-width:420px"><thead><tr><th class="l">${t("flavor")}</th><th>${t("price")}</th><th>${t("unitCost")}</th><th>${t("mMarginPct")}</th></tr></thead><tbody>
    ${FLAVORS.map((f,i)=>`<tr><td class="l" style="white-space:nowrap">${f}</td><td><input class="qty-in" style="width:76px" type="number" step="0.01" min="0" id="pr-${i}" data-pr="${i}" value="${S.price[i].toFixed(2)}"></td>
      <td><input class="qty-in" style="width:76px" type="number" step="0.01" min="0" id="co-${i}" data-co="${i}" value="${S.cost[i].toFixed(2)}"></td><td class="num">${S.price[i]?pct((S.price[i]-S.cost[i])/S.price[i]):"—"}</td></tr>`).join("")}</tbody></table></div></div>`;
  return `<div class="head" style="align-items:center"><h2>${t("mgTitle")}</h2><div style="display:flex;gap:8px;flex-wrap:wrap">

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  if(b.type==="checkbox")return;const a=b.dataset.a;
  if(a==="chgWhen"||a==="chgStep")readChg();
  if(a==="chgStep"){A.chgStep(+b.dataset.v);return;}
  if(A[a]){if(demo.on&&e.isTrusted&&a!=="lang")stopDemoAuto();A[a](b.dataset.v);}});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset&&(el.dataset.pr!=null||el.dataset.co!=null)){const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){if(el.dataset.pr!=null)S.price[+el.dataset.pr]=v;else S.cost[+el.dataset.co]=v;}render();return;}if(el.dataset&&el.dataset.a==="packTick"){if(demo.on&&e.isTrusted)stopDemoAuto();A.packTick(el.dataset.v);}});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset&&el.dataset.cl!=null&&S.session){const dr=closeDraftOf(S.session),f=FLAVORS[+el.dataset.cl];dr.rows[f].left=el.value;const sent=storeQty(S.session,TODAY,f),l=parseInt(el.value,10),c=document.getElementById("cl-sold-"+el.dataset.cl);
    if(c){c.textContent=isNaN(l)?"—":Math.max(0,sent-l);c.style.color=l>sent?"var(--bad)":"";}}
  if(el.id==="cl-by"&&S.session)closeDraftOf(S.session).by=el.value;
  if(el.classList.contains("qty-in")&&el.dataset.d!=null&&S.draft){S.draft[+el.dataset.d][FLAVORS[+el.dataset.f]]=Math.max(0,parseInt(el.value,10)||0);el.setAttribute("value",el.value);recalcGrid();}
  if(el.id==="pin"){S.pinVal=el.value.replace(/\D/g,"").slice(0,4);el.value=S.pinVal;S.pinErr=false;}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin")A.login();if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-a]")){e.preventDefault();e.target.click();}});

function holdFor(st){const x=sx(st.id),b=x[2]||[];const words=((x[0]||"")+" "+(x[1]||"")+" "+b.join(" ")).split(/\s+/).length;
  return (st.story?(2200+b.length*1500+words*80):Math.max(4200,words*230))/speed;}
function renderDemoBar(){const bar=document.getElementById("demobar");bar.hidden=!demo.on;if(!demo.on)return;
  const st=STEPS[Math.max(0,demo.i)],last=demo.i>=STEPS.length-1;
  document.getElementById("demo-step").textContent=CH[lang][st.ch]+" · "+t("stepOf",Math.max(1,demo.i+1),STEPS.length);
  const x=sx(st.id);
  document.getElementById("demo-title").textContent=st.story?"":x[0];
  document.getElementById("demo-cap").textContent=st.story?"":(x[1]||"");
  document.getElementById("demo-pause").textContent=demo.playing?t("pause"):t("play");
  document.getElementById("demo-pause").hidden=last;
  document.getElementById("demo-next").textContent=t("next");
  document.getElementById("demo-speed").textContent=speed+"×";
  document.getElementById("demo-next").hidden=last;
  document.getElementById("demo-exit").textContent=t("exit");
  document.getElementById("demo-prog").style.width=((demo.i+1)/STEPS.length*100)+"%";}
async function runStep(i){const tok=++demo.tok;clearTimeout(demo.timer);demo.i=i;demo.busy=true;renderDemoBar();
  try{await STEPS[i].run(tok);}catch(err){console.error(err);}
  if(tok!==demo.tok)return;demo.busy=false;renderDemoBar();
  if(i>=STEPS.length-1){demo.playing=false;renderDemoBar();return;}
  if(demo.playing)demo.timer=setTimeout(()=>{if(tok===demo.tok&&demo.playing)runStep(i+1);},holdFor(STEPS[i]));}
function startDemo(){demo.on=true;demo.playing=true;demo.story=null;freshState();S.role="store";try{window.scrollTo({top:0});}catch(e){}renderChrome();runStep(0);}
function stopDemoAuto(){demo.playing=false;clearTimeout(demo.timer);renderDemoBar();}
function exitDemo(){demo.on=false;demo.playing=false;demo.story=null;demo.tok++;clearTimeout(demo.timer);render();}
document.getElementById("demo-btn").addEventListener("click",startDemo);
document.getElementById("demo-next").addEventListener("click",()=>{if(demo.i<STEPS.length-1)runStep(demo.i+1);});
document.getElementById("demo-pause").addEventListener("click",()=>{if(demo.playing){stopDemoAuto();}else{demo.playing=true;renderDemoBar();if(!demo.busy&&demo.i<STEPS.length-1)runStep(demo.i+1);}});
document.getElementById("demo-exit").addEventListener("click",exitDemo);
document.getElementById("demo-speed").addEventListener("click",()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];renderDemoBar();});
document.addEventListener("keydown",e=>{if(!demo.on||e.target.matches("input,select,textarea"))return;if(e.key==="ArrowRight"&&demo.i<STEPS.length-1)runStep(demo.i+1);if(e.key===" "){e.preventDefault();document.getElementById("demo-pause").click();}});
